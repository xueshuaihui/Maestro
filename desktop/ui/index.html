<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maestro</title>
  <link rel="icon" type="image/svg+xml" href="./brand/mark.svg">
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountApp } from './app.js';
    const injected = window.__MAESTRO_DESKTOP__ || {};
    const mounted = mountApp({ root: '#app', project: injected.project ?? undefined });
    mounted.app.start().then(() => mounted.paint());
  </script>
</body>
</html>
