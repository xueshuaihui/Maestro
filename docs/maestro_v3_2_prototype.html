function getRunForWorkItem(id){return runs.find(r=>r.workItemId===id)}
function openWorkItem(id){activeWorkItem=id;page='workitems';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='workitems'));render();setTimeout(()=>$('#workItemDetail')?.scrollIntoView({behavior:'smooth'}),30)}
function workItemDetail(item){let r=getRunForWorkItem(item.id),w=item.workflowSnapshot,t=item.teamSnapshot;let completed=r.tasks.filter(x=>x.state==='已完成').length;return `<section id="workItemDetail" style="margin-top:16px"><div class="head"><div><h2 style="font-size:18px;margin:0 0 4px">${esc(item.title)}</h2><div class="sub">${item.id} · 执行实例 ${r.id} · 创建于 ${item.created}</div></div><div class="actions">${btn('执行详情',`nav('runs');setTimeout(()=>openRun('${r.id}'),20)`)} ${btn('事件时间线',`showEvents('${r.id}')`)} ${btn('查看执行方案',`showExecutionPlan('${item.id}')`,'soft')}</div></div><div class="grid three"><div class="card pad"><div class="tiny muted">执行工作流</div><b>${esc(w.name)} · v${w.version}</b><div class="tiny muted">${w.nodes.length} 个节点</div></div><div class="card pad"><div class="tiny muted">执行团队</div><b>${esc(t.name)} · v${t.version}</b><div class="tiny muted">${t.members.length} 位成员</div></div><div class="card pad"><div class="tiny muted">执行进度</div><b>${completed}/${r.tasks.length} 个节点完成</b><div class="progress"><span style="width:${Math.round(completed/r.tasks.length*100)}%"></span></div></div></div><div class="card pad" style="margin-top:14px"><div class="between"><h3 class="title">工作流执行图 · 团队成员是节点执行者</h3><span class="badge blue">${r.state}</span></div><div class="flow">${r.tasks.map((task,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${task.state==='已完成'?'done':task.state==='执行中'?'run':task.state==='已中断'||task.state==='失败'?'fail':'wait'}" onclick="taskDetail('${r.id}','${task.id}')"><div class="between"><b>${esc(task.name)}</b>${badgeState(task.state)}</div><div class="tiny muted" style="margin-top:7px">${task.role?getRole(task.role)?.name:'人工节点'}</div><div style="margin-top:9px"><b>${task.employeeId?getEmp(task.employeeId)?.name:(task.plannedEmployeeId?getEmp(task.plannedEmployeeId)?.name:'未分配')}</b></div><div class="tiny muted">${task.cliId?getCli(task.cliId)?.name:'CLI：任务启动时选择'}</div><div class="tiny muted">${task.employeeSessionId?'员工会话已创建':'尚无员工会话'}</div></div>`).join('')}</div></div><div class="card pad" style="margin-top:14px"><div class="between"><h3 class="title">节点任务</h3><span class="tiny muted">节点角色要求 → 团队成员执行 → 任务级 CLI 分配</span></div><table class="table"><thead><tr><th>节点</th><th>角色要求</th><th>团队执行成员</th><th>CLI</th><th>员工会话</th><th>状态</th><th>操作</th></tr></thead><tbody>${r.tasks.map(task=>`<tr><td><b>${esc(task.name)}</b><div class="tiny muted">${task.id}</div></td><td>${task.role?getRole(task.role)?.name:'人工'}</td><td>${getEmp(task.employeeId||task.plannedEmployeeId)?.name||'—'}</td><td>${task.cliId?getCli(task.cliId)?.name:'尚未分配'}</td><td>${task.employeeSessionId?`<span class="mono">${task.employeeSessionId}</span>`:'尚未创建'}</td><td>${badgeState(task.state)}</td><td>${task.type==='human'?btn('查看','taskDetail(\''+r.id+'\',\''+task.id+'\')','sm'):task.state==='待分配'||task.state==='Ready'?btn('分配执行',`assignTask('${r.id}','${task.id}')`,'sm primary'):task.state==='已分配待启动'?btn('修改 / 启动',`assignTask('${r.id}','${task.id}')`,'sm'):task.state==='执行中'?btn('任务详情',`taskDetail('${r.id}','${task.id}')`,'sm'):task.state==='已中断'?btn('恢复',`resumeTask('${r.id}','${task.id}')`,'sm soft'):btn('详情',`taskDetail('${r.id}','${task.id}')`,'sm')}</td></tr>`).join('')}</tbody></table></div></section>`}
function workItemsPage(){return `${head('工作入口 / 需求与任务','需求 / 任务','每个需求或任务选择一个工作流和一个团队。工作流定义怎么做，团队成员负责执行其中的节点。',btn('新建需求 / 任务','startWorkItemWizard()','primary'))}<div class="grid four"><div class="card stat"><div class="muted tiny">全部需求</div><b>${workItems.length}</b></div><div class="card stat"><div class="muted tiny">执行中</div><b>${workItems.filter(x=>x.state==='执行中').length}</b></div><div class="card stat"><div class="muted tiny">待人工处理</div><b>${runs.reduce((n,r)=>n+r.tasks.filter(t=>t.state==='待人工处理').length,0)}</b></div><div class="card stat"><div class="muted tiny">待验收</div><b>${workItems.filter(x=>x.state==='待验收').length}</b></div></div><div class="card" style="margin-top:15px"><table class="table"><thead><tr><th>需求 / 任务</th><th>执行工作流</th><th>执行团队</th><th>状态</th><th>创建时间</th><th></th></tr></thead><tbody>${workItems.map(w=>`<tr class="click" onclick="openWorkItem('${w.id}')"><td><b>${esc(w.title)}</b><div class="tiny muted">${w.id}</div></td><td>${esc(w.workflowSnapshot.name)} <span class="tiny muted">v${w.workflowSnapshot.version}</span></td><td>${esc(w.teamSnapshot.name)} <span class="tiny muted">v${w.teamSnapshot.version}</span></td><td>${badgeState(w.state)}</td><td>${w.created}</td><td><button class="btn sm" onclick="event.stopPropagation();openWorkItem('${w.id}')">打开 →</button></td></tr>`).join('')}</tbody></table></div>${workItems.find(x=>x.id===activeWorkItem)?workItemDetail(workItems.find(x=>x.id===activeWorkItem)):''}`}
function teamsPage(){return `${head('团队资产 / 团队库','团队库','团队是可复用的员工组合。团队不绑定某个工作流；需求执行时，团队成员按角色资格映射到所选工作流的执行节点。',btn('新建团队','editTeam()','primary'))}<div class="notice"><b>团队与工作流是独立资产。</b><div class="sub">团队只维护成员和成员可承担的角色，不设置“适用工作流”，也不绑定 CLI。一个团队可以执行不同工作流；创建需求时会检查角色覆盖并生成本次节点执行人映射。</div></div><div class="grid two">${teams.map(t=>`<div class="card pad"><div class="between"><div><b>${esc(t.name)}</b><div class="tiny muted">${t.id} · v${t.version}</div></div><span class="badge ${t.kind==='内置'?'purple':'blue'}">${t.kind}</span></div><p class="sub">${esc(t.desc)}</p>${t.members.map(m=>`<div class="member"><div class="left"><div class="avatar">${getEmp(m.employeeId)?.name.slice(0,1)||'?'}</div><div><b>${getEmp(m.employeeId)?.name||m.employeeId}</b><div class="tiny muted">${m.roles.map(r=>getRole(r)?.name).join('、')}</div></div></div><span class="tiny muted">团队成员 / 节点执行者</span></div>`).join('')}<div class="between" style="margin-top:12px"><span class="tiny muted">${t.members.length} 名成员 · ${new Set(t.members.flatMap(m=>m.roles)).size} 种角色覆盖</span><button class="btn sm" onclick="editTeam('${t.id}')">编辑团队</button></div></div>`).join('')}</div>`}
function editTeam(id){let t=id?getTeam(id):{name:'',desc:'',members:[]};openModal(`<h3>${id?'编辑团队':'新建团队'}</h3><p class="sub">团队仅维护成员。每个成员可承担其具备的角色；不绑定工作流、CLI 或会话。</p><div class="field"><label>团队名称</label><input id="teamName" value="${esc(t.name)}" placeholder="例如：智能产品研发小队"></div><div class="field"><label>团队说明</label><textarea id="teamDesc">${esc(t.desc||'')}</textarea></div><h4>团队成员与可承担角色</h4>${employees.filter(e=>e.enabled).map(e=>{let m=t.members.find(x=>x.employeeId===e.id);return `<div class="member"><div class="left"><input type="checkbox" class="teamMemberCheck" value="${e.id}" ${m?'checked':''} onchange="toggleTeamRoleBox('${e.id}',this.checked)"><div><b>${e.name}</b><div class="tiny muted">${e.id}</div></div></div><div id="rolebox-${e.id}" class="pilllist">${e.roles.map(r=>`<label class="tag"><input type="checkbox" class="teamRole-${e.id}" value="${r}" ${(!m||m.roles.includes(r))?'checked':''}>${getRole(r)?.name}</label>`).join('')}</div></div>`}).join('')}<div class="notice">保存团队时只保存 Employee ID 和团队内承担的角色。实际某个节点由谁执行，会在需求选择工作流和团队后形成节点映射。</div><div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTeam('${id||''}')">保存团队</button></div>`)}
function toggleTeamRoleBox(id,on){let box=$('#rolebox-'+id);box.style.opacity=on?'1':'.35';box.querySelectorAll('input').forEach(x=>x.disabled=!on)}
function saveTeam(id){let name=$('#teamName').value.trim();if(!name)return toast('请填写团队名称');let members=[...document.querySelectorAll('.teamMemberCheck:checked')].map(c=>({employeeId:c.value,roles:[...document.querySelectorAll('.teamRole-'+c.value+':checked')].map(x=>x.value)})).filter(m=>m.roles.length);if(!members.length)return toast('请至少选择一名有角色资格的团队成员');let old=id?getTeam(id):null;let obj={id:id||'TEAM-'+String(4+teams.length).padStart(3,'0'),name,version:old?(+(old.version)+.1).toFixed(1):'1.0',kind:old?.kind||'自定义',desc:$('#teamDesc').value,members};if(id)teams[teams.findIndex(x=>x.id===id)]=obj;else teams.push(obj);closeModal();render();toast('团队已保存；不绑定工作流、CLI 或会话')}
function workflowsPage(){return `${head('团队资产 / 工作流库','工作流库','工作流是可复用的执行方法，定义节点、角色要求、依赖和门禁，不包含具体团队成员或 CLI。',btn('新建工作流','editWorkflow()','primary'))}<div class="notice"><b>工作流回答“怎么做”，团队回答“谁来做”。</b><div class="sub">在需求执行方案中组合一个工作流和一个团队，并为工作流 Agent 节点生成执行人映射。</div></div><div class="grid two">${workflows.map(w=>`<div class="card pad"><div class="between"><span class="badge ${w.kind==='内置'?'purple':'blue'}">${w.kind}</span><span class="tiny muted">v${w.version}</span></div><h3 style="font-size:16px;margin:10px 0 4px">${esc(w.name)}</h3><p class="sub">${esc(w.desc)}</p><div class="tiny muted">${w.nodes.length} 个节点 · ${w.nodes.filter(n=>n.type==='agent').length} 个 Agent 节点 · ${w.nodes.filter(n=>n.type==='human').length} 个人工节点</div>${w.nodes.map(n=>`<div class="kv"><span>${esc(n.name)}</span><b>${n.type==='human'?'人工节点':getRole(n.role)?.name}</b></div>`).join('')}<div class="between" style="margin-top:12px"><button class="btn sm" onclick="editWorkflow('${w.id}')">编辑工作流</button><button class="btn sm primary" onclick="quickStart('${w.id}')">用于新需求 →</button></div></div>`).join('')}</div>`}
function editWorkflow(id){let w=id?getWF(id):null;openModal(`<h3>${id?'编辑工作流定义':'新建工作流定义'}</h3><p class="sub">只定义节点和角色要求，不选择员工或 CLI。</p><div class="field"><label>工作流名称</label><input id="wfName" value="${esc(w?.name||'')}" placeholder="例如：产品研发完整流程"></div><div class="field"><label>说明</label><textarea id="wfDesc">${esc(w?.desc||'')}</textarea></div><h4>节点定义</h4><div id="wfNodeEditor">${(w?.nodes||[{id:'N1',name:'需求分析',role:'pm',deps:[],type:'agent'}]).map((n,i)=>workflowNodeEditor(n,i)).join('')}</div><button class="btn sm" onclick="addWorkflowNode()">+ 添加节点</button><div class="notice" style="margin-top:12px">节点通过 Role ID 声明执行岗位。运行时由需求绑定的团队提供合格成员，任务 Ready 后再决定 CLI。</div><div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveWorkflow('${id||''}')">保存并发布新版本</button></div>`)}
function workflowNodeEditor(n,i){return `<div class="grid three" style="grid-template-columns:1.1fr 1fr 1.1fr;margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px"><input type="hidden" class="wfNodeId" value="${esc(n.id||('N-CUSTOM-'+Date.now()+'-'+i))}"><div class="field"><label>节点名称</label><input class="wfNodeName" value="${esc(n.name)}"></div><div class="field"><label>执行角色</label><select class="wfNodeRole"><option value="human" ${n.type==='human'?'selected':''}>人工处理</option>${roles.map(r=>`<option value="${r.id}" ${n.role===r.id?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="field"><label>前置节点 ID（逗号分隔）</label><input class="wfNodeDeps" value="${(n.deps||[]).join(',')}" placeholder="例如 N1,N2"></div></div>`}
function addWorkflowNode(){let box=$('#wfNodeEditor'),i=box.children.length;box.insertAdjacentHTML('beforeend',workflowNodeEditor({id:'N-CUSTOM-'+Date.now(),name:'新节点',role:'pm',deps:[],type:'agent'},i))}
function saveWorkflow(id){let name=$('#wfName').value.trim();if(!name)return toast('请填写工作流名称');let rows=[...document.querySelectorAll('#wfNodeEditor > div')];let nodes=rows.map((row,i)=>{let nm=row.querySelector('.wfNodeName').value.trim(),role=row.querySelector('.wfNodeRole').value,raw=row.querySelector('.wfNodeDeps').value;return {id:row.querySelector('.wfNodeId').value,name:nm||'节点'+(i+1),role:role==='human'?null:role,deps:raw.split(',').map(x=>x.trim()).filter(Boolean),type:role==='human'?'human':'agent'}});if(!nodes.length)return toast('至少需要一个节点');let old=id?getWF(id):null;let obj={id:id||'WF-'+String(4+workflows.length).padStart(3,'0'),name,version:old?(+(old.version)+.1).toFixed(1):'1.0',kind:old?.kind||'自定义',desc:$('#wfDesc').value,nodes};if(id)workflows[workflows.findIndex(x=>x.id===id)]=obj;else workflows.push(obj);closeModal();render();toast('工作流已发布；既有需求执行实例继续使用原版本快照')}
function quickStart(wfId){startWorkItemWizard();workItemWizard.workflowId=wfId;workItemWizard.workflowMode='existing';showWorkItemWizard()}
function employeesPage(){return `${head('团队资产 / 员工档案','员工档案','员工是长期维护的数字员工身份。员工不绑定 CLI；员工进入团队后，才可能成为某个工作流节点的执行者。',btn('新建员工','newEmployee()','primary'))}<div class="notice"><b>员工档案不绑定 CLI，也不固定属于某个团队。</b><div class="sub">员工可以加入多个团队或从团队移除。具体在某个需求中由哪个员工执行哪个节点，取决于团队组成和本次节点映射。</div></div><div class="card"><table class="table"><thead><tr><th>员工</th><th>可承担角色</th><th>团队成员身份</th><th>运行状态</th><th>员工会话</th><th></th></tr></thead><tbody>${employees.map(e=>{let session=getSession(e.id),teamNames=teams.filter(t=>t.members.some(m=>m.employeeId===e.id)).map(t=>t.name);let running=runs.flatMap(r=>r.tasks).find(t=>t.employeeId===e.id&&['执行中','已中断'].includes(t.state));return `<tr><td><div class="row"><div class="avatar">${e.name.slice(0,1)}</div><div><b>${esc(e.name)}</b><div class="tiny muted">${e.id} · ${esc(e.title)}</div></div></div></td><td>${e.roles.map(r=>`<span class="tag">${getRole(r)?.name}</span>`).join(' ')}</td><td>${teamNames.length?teamNames.map(n=>`<span class="tag">${esc(n)}</span>`).join(' '):'<span class="muted">尚未加入团队</span>'}</td><td>${running?badgeState(running.state==='执行中'?'执行中':'已中断'):'<span class="badge green">空闲</span>'}</td><td>${session?`<span class="mono">${session.id}</span>`:'尚未创建'}</td><td><button class="btn sm" onclick="employeeDetail('${e.id}')">详情</button></td></tr>`}).join('')}</tbody></table></div>`}
function newEmployee(){openModal(`<h3>创建员工档案</h3><p class="sub">只建立员工身份和角色资格。员工可以加入多个团队，不绑定 CLI，不创建会话。</p><div class="field"><label>员工名称</label><input id="empName" placeholder="例如：产品经理-02"></div><div class="field"><label>职务说明</label><input id="empTitle" placeholder="例如：需求分析专员"></div><div class="field"><label>可承担角色</label>${roles.map(r=>`<label class="checkrow"><input type="checkbox" class="empRole" value="${r.id}"><span><b>${r.name}</b><div class="tiny muted">${r.desc}</div></span></label>`).join('')}</div><div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEmployee()">创建员工</button></div>`)}
function saveEmployee(){let name=$('#empName').value.trim();if(!name)return toast('请填写员工名称');let id='EMP-'+String(1+employees.length+1).padStart(3,'0');employees.push({id,name,title:$('#empTitle').value,roles:[...document.querySelectorAll('.empRole:checked')].map(x=>x.value),enabled:true});closeModal();render();toast('员工档案已创建；尚未绑定 CLI、团队或会话')}
function employeeDetail(id){let e=getEmp(id),s=getSession(id),memberships=teams.filter(t=>t.members.some(m=>m.employeeId===id));openModal(`<h3>${esc(e.name)}</h3><p class="sub">${e.id} · 员工档案</p><div class="kv"><span>职务</span><b>${esc(e.title||'—')}</b></div><div class="kv"><span>角色资格</span><b>${e.roles.map(r=>getRole(r)?.name).join('、')||'未配置'}</b></div><div class="kv"><span>CLI 绑定</span><b>无；按工作流节点任务分配</b></div><div class="kv"><span>所属团队</span><b>${memberships.map(t=>t.name).join('、')||'无'}</b></div><div class="kv"><span>员工逻辑会话</span><b>${s?s.id:'首次实际执行任务时按需创建'}</b></div>${s?`<div class="kv"><span>宿主会话映射</span><div>${s.hosts.map(h=>`<div class="mono">${getCli(h.cliId)?.name}: ${h.hostSessionId} · ${h.status}</div>`).join('')}</div></div>`:''}<div class="foot"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function rolesPage(){return `${head('团队资产 / 角色库','角色库','角色定义岗位职责和能力要求，工作流节点引用角色，团队成员通过角色资格匹配成为节点执行者。',btn('新建角色','editRole()','primary'))}<div class="grid two">${roles.map(r=>`<div class="card pad"><div class="between"><b>${r.name}</b><span class="badge purple">Role Definition</span></div><p class="sub">${r.desc}</p><div class="pilllist">${r.caps.map(c=>`<span class="tag">${c}</span>`).join('')}</div><div class="tiny muted" style="margin-top:10px">员工资格：${employees.filter(e=>e.roles.includes(r.id)).length} 人 · 团队覆盖：${teams.filter(t=>t.members.some(m=>m.roles.includes(r.id))).length} 个团队</div></div>`).join('')}</div>`}
function editRole(){openModal(`<h3>角色定义</h3><p class="sub">原型中角色作为独立定义资产维护。正式产品应提供版本、提示词、技能和 I/O 契约编辑器。</p><div class="notice">当前角色库展示预置角色及其能力要求。V0.2 的核心交互重点是让工作流节点和团队成员通过 Role ID 匹配。</div><div class="foot"><button class="btn primary" onclick="closeModal()">完成</button></div>`)}
function runsPage(){return `${head('执行管理 / 执行中心','执行中心','从需求执行方案进入每个工作流节点。节点执行者来自团队；CLI 在任务实际启动前选择。',btn('查看需求 / 任务','nav(\'workitems\')','primary'))}<div class="card"><table class="table"><thead><tr><th>需求 / 任务</th><th>工作流</th><th>团队</th><th>状态</th><th>进度</th><th></th></tr></thead><tbody>${runs.map(r=>`<tr class="click" onclick="openRun('${r.id}')"><td><b>${esc(r.title)}</b><div class="tiny muted">${r.id} · ${r.workItemId}</div></td><td>${esc(r.workflowName)} · v${r.workflowVersion}</td><td>${esc(r.teamName)} · v${r.teamVersion}</td><td>${badgeState(r.state)}</td><td>${r.progress}%<div class="progress"><span style="width:${r.progress}%"></span></div></td><td><button class="btn sm" onclick="event.stopPropagation();openRun('${r.id}')">打开 →</button></td></tr>`).join('')}</tbody></table></div>${getRun(activeRun)?runDetail(getRun(activeRun)):''}`}
function openRun(id){activeRun=id;page='runs';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='runs'));render();setTimeout(()=>$('#runDetail')?.scrollIntoView({behavior:'smooth'}),25)}
function runDetail(r){let item=getItem(r.workItemId);return `<section id="runDetail" style="margin-top:16px"><div class="head"><div><h2 style="font-size:18px;margin:0 0 4px">${esc(r.title)}</h2><div class="sub">${r.id} · ${r.workflowName} v${r.workflowVersion} · 团队 ${r.teamName} v${r.teamVersion}</div></div><div class="actions">${btn('查看需求','openWorkItem(\''+r.workItemId+'\')')} ${btn('事件时间线',`showEvents('${r.id}')`)} ${btn('暂停调度',`pauseRun('${r.id}')`)} ${btn('继续调度',`continueRun('${r.id}')`,'soft')}</div></div><div class="notice"><b>职责分工：</b>工作流节点声明角色要求；本次需求绑定的团队提供成员；节点进入 Ready 后，形成实际执行分配并选择 Agent CLI。</div><div class="card pad"><h3 class="title">团队执行流程</h3><div class="flow">${r.tasks.map((t,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${t.state==='已完成'?'done':t.state==='执行中'?'run':t.state==='已中断'||t.state==='失败'?'fail':'wait'}" onclick="taskDetail('${r.id}','${t.id}')"><div class="between"><b>${esc(t.name)}</b>${badgeState(t.state)}</div><div class="tiny muted" style="margin-top:6px">${t.role?getRole(t.role)?.name:'人工节点'}</div><div style="margin-top:8px"><b>${getEmp(t.employeeId||t.plannedEmployeeId)?.name||'待分配'}</b></div><div class="tiny muted">${t.cliId?getCli(t.cliId)?.name:'未选择 CLI'}</div><div class="tiny muted">${t.employeeSessionId?'Session 已创建':'Session 尚未创建'}</div></div>`).join('')}</div></div><div class="card pad" style="margin-top:14px"><div class="between"><h3 class="title">节点执行清单</h3><span class="tiny muted">${r.tasks.filter(t=>t.state==='已完成').length}/${r.tasks.length} 完成</span></div><table class="table"><thead><tr><th>工作流节点</th><th>角色要求</th><th>团队执行成员</th><th>Agent CLI</th><th>员工会话</th><th>状态</th><th>操作</th></tr></thead><tbody>${r.tasks.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="tiny muted">${t.id}</div></td><td>${t.role?getRole(t.role)?.name:'人工'}</td><td>${getEmp(t.employeeId||t.plannedEmployeeId)?.name||'—'}</td><td>${t.cliId?getCli(t.cliId)?.name:'未分配'}</td><td>${t.employeeSessionId?`<span class="mono">${t.employeeSessionId}</span>`:'未创建'}</td><td>${badgeState(t.state)}</td><td>${t.type==='human'?btn('详情',`taskDetail('${r.id}','${t.id}')`,'sm'):t.state==='待分配'||t.state==='Ready'?btn('分配执行',`assignTask('${r.id}','${t.id}')`,'sm primary'):t.state==='已分配待启动'?btn('修改 / 启动',`assignTask('${r.id}','${t.id}')`,'sm'):t.state==='已中断'?btn('恢复',`resumeTask('${r.id}','${t.id}')`,'sm soft'):btn('详情',`taskDetail('${r.id}','${t.id}')`,'sm')}</td></tr>`).join('')}</tbody></table></div><div class="grid two" style="margin-top:14px"><div class="card pad"><h3 class="title">当前员工活动</h3>${r.tasks.filter(t=>t.employeeId&&['执行中','已中断'].includes(t.state)).map(t=>`<div class="item"><div class="between"><b>${getEmp(t.employeeId)?.name}</b>${badgeState(t.state)}</div><div class="tiny muted">${t.name} · ${getCli(t.cliId)?.name}</div><div>${esc(t.activity)}</div><div class="mono">${t.employeeSessionId||'—'} / ${t.hostSessionId||'—'}</div></div>`).join('')||'<div class="empty">当前没有活跃员工任务</div>'}</div><div class="card pad"><h3 class="title">按需创建的员工会话</h3>${[...new Set(r.tasks.filter(t=>t.employeeSessionId).map(t=>t.employeeId))].map(eid=>{let s=getSession(eid);return `<div class="item"><b>${getEmp(eid)?.name}</b><div class="mono">Employee Session: ${s?.id}</div>${(s?.hosts||[]).map(h=>`<div class="tiny muted">${getCli(h.cliId)?.name}: ${h.hostSessionId} · ${h.status}</div>`).join('')}</div>`}).join('')||'<div class="empty">尚无员工会话。任务进入 Ready 并启动后才创建。</div>'}</div></div></section>`}
function assignTask(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),item=getItem(r.workItemId),team=item.teamSnapshot;let candidates=eligibleMembers(team,t.role);if(!candidates.length)return toast('团队中没有符合该节点角色要求的成员，请编辑团队或本次执行人映射');let chosen=t.employeeId||t.plannedEmployeeId||candidates[0].employeeId;openModal(`<h3>分配工作流节点</h3><p class="sub">${esc(t.name)} · 角色要求：${getRole(t.role)?.name}</p><div class="notice">该节点的执行者必须来自本次需求绑定的团队。CLI 只在此节点任务级别选择；保存待启动分配不会创建员工会话。</div><div class="field"><label>团队执行成员</label><select id="taskEmployee">${candidates.map(m=>`<option value="${m.employeeId}" ${m.employeeId===chosen?'selected':''}>${getEmp(m.employeeId)?.name} · ${getEmp(m.employeeId)?.id}</option>`).join('')}</select></div><div class="field"><label>本节点使用的 Agent CLI</label><select id="taskCli">${cliData.filter(c=>c.available).map(c=>`<option value="${c.id}" ${c.id===t.cliId?'selected':''}>${c.name} · ${c.version} · ${c.protocol}</option>`).join('')}</select></div><div class="field"><label>执行目录</label><input id="taskWorkspace" value="~/workspace/${r.workItemId.toLowerCase()}" /></div><div class="notice good" id="sessionExplain">${sessionExplain(chosen,t.cliId||cliData.find(c=>c.available)?.id)}</div><div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn soft" onclick="saveTaskAssignment('${runId}','${taskId}',false)">保存待启动分配</button><button class="btn primary" onclick="saveTaskAssignment('${runId}','${taskId}',true)">保存并启动节点</button></div>`);$('#taskEmployee').onchange=()=>$('#sessionExplain').textContent=sessionExplain($('#taskEmployee').value,$('#taskCli').value);$('#taskCli').onchange=()=>$('#sessionExplain').textContent=sessionExplain($('#taskEmployee').value,$('#taskCli').value)}
function sessionExplain(empId,cliId){let s=getSession(empId),c=getCli(cliId),binding=s?.hosts.slice().reverse().find(h=>h.cliId===cliId);if(!s)return `员工 ${getEmp(empId)?.name} 尚无 Employee Session。启动时才创建员工逻辑会话，并为 ${c?.name||'所选 CLI'} 创建 Host Session。`;if(binding&&c?.caps.includes('resume'))return `该员工已有逻辑会话和 ${c.name} 的宿主会话映射。启动时优先检查并唤醒/恢复该 Host Session。`;return `沿用员工的 Employee Session ID，为 ${c?.name||'所选 CLI'} 创建新的 Host Session Binding；不跨 CLI 复用 Host Session ID。`}
function saveTaskAssignment(runId,taskId,startNow){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),item=getItem(r.workItemId),team=item.teamSnapshot,employeeId=$('#taskEmployee').value,cliId=$('#taskCli').value,c=getCli(cliId);if(!eligibleMembers(team,t.role).some(m=>m.employeeId===employeeId))return toast('所选员工不是本次执行团队中符合角色要求的成员');if(!c?.available)return toast('CLI 不可用，请重新扫描或选择其他 CLI');let occupied=runs.flatMap(x=>x.tasks).find(x=>x.employeeId===employeeId&&x.state==='执行中'&&x.id!==taskId);if(occupied)return toast(`员工正在执行“${occupied.name}”，同一员工会话默认串行`);t.employeeId=employeeId;t.cliId=cliId;t.assignmentState='prepared';t.state='已分配待启动';t.activity='已分配团队成员和 CLI，等待启动；尚未创建会话';r.events.unshift(['刚刚','节点执行分配',`${t.name} → ${getEmp(employeeId).name} + ${c.name}`]);closeModal();render();if(startNow)startTask(runId,taskId);else toast('已保存待启动分配；此时仍可修改执行成员或 CLI')}
function startTask(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);if(!t.employeeId||!t.cliId)return toast('请先完成团队成员和 CLI 分配');let cli=getCli(t.cliId);if(!cli?.available)return toast('CLI 当前不可用');let occupied=runs.flatMap(x=>x.tasks).find(x=>x.employeeId===t.employeeId&&x.state==='执行中'&&x.id!==taskId);if(occupied)return toast(`员工被任务 ${occupied.name} 占用`);let s=getSession(t.employeeId);if(!s){s={employeeId:t.employeeId,id:'emp_sess_'+Math.random().toString(16).slice(2,9),status:'idle',hosts:[]};employeeSessions.push(s);r.events.unshift(['刚刚','创建员工逻辑会话',`${getEmp(t.employeeId).name} · ${s.id}`])}let h=s.hosts.slice().reverse().find(x=>x.cliId===t.cliId&&['空闲，可复用','中断，可恢复','活动中'].includes(x.status));let reused=!!h&&cli.caps.includes('resume');if(!reused){h={cliId:t.cliId,hostSessionId:'host_'+Math.random().toString(16).slice(2,9),status:'活动中',last:'刚刚'};s.hosts.push(h)}else{h.status='活动中';h.last='刚刚'}t.employeeSessionId=s.id;t.hostSessionId=h.hostSessionId;t.state='执行中';t.attempt++;t.activity=(reused?'唤醒 / 复用':'创建')+' Host Session，正在执行任务';s.status='active';r.state='执行中';r.events.unshift(['刚刚','节点启动',`${t.name} · ${getEmp(t.employeeId).name} · ${cli.name} · Attempt ${t.attempt}`]);let wi=getItem(r.workItemId);wi.state='执行中';render();toast('节点已启动；员工会话按需创建或唤醒（模拟）')}
function taskDetail(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);openModal(`<h3>${esc(t.name)}</h3><p class="sub">${t.id} · ${t.role?getRole(t.role)?.name:'人工处理'} · ${t.state}</p><div class="kv"><span>所属需求</span><b>${esc(r.title)}</b></div><div class="kv"><span>工作流</span><b>${esc(r.workflowName)} · v${r.workflowVersion}</b></div><div class="kv"><span>执行团队</span><b>${esc(r.teamName)} · v${r.teamVersion}</b></div><div class="kv"><span>节点执行成员</span><b>${getEmp(t.employeeId||t.plannedEmployeeId)?.name||'尚未分配'}</b></div><div class="kv"><span>任务级 CLI</span><b>${t.cliId?getCli(t.cliId)?.name:'尚未分配'}</b></div><div class="kv"><span>Employee Session ID</span><span class="mono">${t.employeeSessionId||'尚未创建'}</span></div><div class="kv"><span>Host Session ID</span><span class="mono">${t.hostSessionId||'尚未创建'}</span></div><div class="kv"><span>Attempt</span><b>${t.attempt}</b></div><div class="kv"><span>当前活动</span><b>${esc(t.activity)}</b></div><div class="notice">${t.employeeSessionId?'会话已建立，本次执行的成员、CLI 和宿主会话已固定。':t.cliId?'已保存节点执行分配，但尚未启动会话；仍可修改成员或 CLI。':'节点尚未分配执行成员和 CLI。'}</div><div class="foot"><button class="btn" onclick="closeModal()">关闭</button>${t.state==='待分配'?`<button class="btn primary" onclick="closeModal();assignTask('${runId}','${taskId}')">分配节点</button>`:''}${t.state==='已分配待启动'?`<button class="btn" onclick="closeModal();assignTask('${runId}','${taskId}')">修改分配</button><button class="btn primary" onclick="closeModal();startTask('${runId}','${taskId}')">启动节点</button>`:''}${t.state==='执行中'?`<button class="btn primary" onclick="completeTask('${runId}','${taskId}')">模拟完成节点</button><button class="btn danger" onclick="interruptTask('${runId}','${taskId}')">模拟中断</button>`:''}${t.state==='已中断'?`<button class="btn soft" onclick="closeModal();resumeTask('${runId}','${taskId}')">恢复节点</button>`:''}${t.type==='human'&&t.state==='待人工处理'?`<button class="btn primary" onclick="approveHumanTask('${runId}','${taskId}')">批准并继续</button>`:''}</div>`)}
function approveHumanTask(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);if(!t||t.type!=='human'||t.state!=='待人工处理')return;t.state='已完成';t.activity='人工审批已通过';r.events.unshift(['刚刚','人工节点批准',t.name+' 已批准']);r.tasks.forEach(c=>{if(c.state==='等待依赖'&&c.deps.every(dep=>r.tasks.some(z=>z.nodeId===dep&&['已完成','已验收'].includes(z.state)))){c.state=c.type==='human'?'待人工处理':'待分配';c.activity=c.type==='human'?'上游完成，等待人工处理':'上游依赖满足，等待团队成员和 CLI 分配'}});if(r.tasks.every(x=>['已完成','已验收'].includes(x.state))){r.state='待验收';let wi=getItem(r.workItemId);wi.state='待验收'}closeModal();render();toast('人工节点已批准，工作流继续推进（模拟）')}
function completeTask(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);if(!t||t.state!=='执行中')return;t.state='已完成';t.activity='节点产物已提交';let s=getSession(t.employeeId);if(s)s.status='idle';if(s){let h=s.hosts.find(x=>x.hostSessionId===t.hostSessionId);if(h){h.status='空闲，可复用';h.last='刚刚'}}r.tasks.forEach(c=>{if(c.state==='等待依赖'&&c.deps.every(dep=>r.tasks.some(z=>z.nodeId===dep&&['已完成','已验收'].includes(z.state)))){c.state=c.type==='human'?'待人工处理':'待分配';c.activity=c.type==='human'?'上游完成，等待人工处理':'上游依赖满足，等待团队成员和 CLI 分配'}});let done=r.tasks.filter(x=>x.state==='已完成').length;r.progress=Math.round(done/r.tasks.length*100);r.events.unshift(['刚刚','节点完成',t.name+' 已完成，调度器检查后续依赖']);if(r.tasks.every(x=>['已完成','已验收'].includes(x.state))){r.state='待验收';let wi=getItem(r.workItemId);wi.state='待验收'}render();toast('节点已完成；符合依赖的后续节点已解锁（模拟）')}
function interruptTask(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);t.state='已中断';t.activity='Agent 宿主连接中断，等待恢复';let s=getSession(t.employeeId);if(s){s.status='interrupted';let h=s.hosts.find(x=>x.hostSessionId===t.hostSessionId);if(h)h.status='中断，可恢复'}r.state='执行中';r.events.unshift(['刚刚','节点中断',t.name+' · 保留 Employee Session / Host Session 引用']);render();toast('节点已标记中断，保留原会话映射')}
function resumeTask(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),s=getSession(t.employeeId);openModal(`<h3>恢复节点任务</h3><p class="sub">${esc(t.name)} · ${getEmp(t.employeeId)?.name}</p><div class="kv"><span>Employee Session ID</span><b class="mono">${s?.id||'缺失'}</b></div><div class="kv"><span>原 CLI</span><b>${getCli(t.cliId)?.name}</b></div><div class="kv"><span>原 Host Session ID</span><b class="mono">${t.hostSessionId}</b></div><div class="field"><label>恢复策略</label><select id="resumeCli"><option value="${t.cliId}">优先恢复原 CLI / Host Session</option>${cliData.filter(c=>c.available&&c.id!==t.cliId).map(c=>`<option value="${c.id}">改用 ${c.name}，通过检查点恢复</option>`).join('')}</select></div><div class="notice warn">使用原 CLI 且宿主支持恢复时，可以继续原 Attempt。更换 CLI 会创建新 Host Session 和新 Attempt，但保留员工身份与逻辑会话 ID。</div><div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmResume('${runId}','${taskId}')">提交恢复</button></div>`)}
function confirmResume(runId,taskId){let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),newCli=$('#resumeCli').value,c=getCli(newCli),s=getSession(t.employeeId);let same=newCli===t.cliId&&c.caps.includes('resume');let h=s.hosts.find(x=>x.cliId===newCli&&x.hostSessionId===t.hostSessionId);if(!same||!h){h={cliId:newCli,hostSessionId:'host_'+Math.random().toString(16).slice(2,9),status:'活动中',last:'刚刚'};s.hosts.push(h);t.attempt++;t.activity='通过检查点恢复，创建新 Host Session / Attempt'}else{t.activity='恢复原 Host Session，继续原 Attempt'}h.status='活动中';h.last='刚刚';t.cliId=newCli;t.hostSessionId=h.hostSessionId;t.employeeSessionId=s.id;t.state='执行中';s.status='active';r.state='执行中';r.events.unshift(['刚刚','节点恢复',t.name+' · '+c.name+' · '+t.activity]);closeModal();render();toast('恢复请求已提交（模拟）')}
function showExecutionPlan(itemId){let item=getItem(itemId),r=getRunForItem(itemId);openModal(`<h3>本次需求执行方案</h3><p class="sub">${esc(item.title)}</p><div class="kv"><span>工作流快照</span><b>${esc(item.workflowSnapshot.name)} · v${item.workflowSnapshot.version}</b></div><div class="kv"><span>团队快照</span><b>${esc(item.teamSnapshot.name)} · v${item.teamSnapshot.version}</b></div><h4>节点执行人映射</h4>${r.tasks.map(t=>`<div class="kv"><span>${esc(t.name)}</span><b>${t.type==='human'?'人工处理':getEmp(t.plannedEmployeeId)?.name||'未映射'}</b></div>`).join('')}<div class="notice">该映射属于本次需求执行方案快照，不会因为团队库后续修改而自动变化。</div><div class="foot"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function showEvents(runId){let r=getRun(runId);openModal(`<h3>${esc(r.title)} · 事件时间线</h3>${r.events.map(e=>`<div class="item"><b>${esc(e[1])}</b><div class="tiny muted">${esc(e[0])} · ${esc(e[2])}</div></div>`).join('')}<div class="foot"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function pauseRun(id){let r=getRun(id);r.state='已暂停';r.events.unshift(['刚刚','调度暂停','不再派发新的节点；运行中的节点按安全策略处理']);render();toast('已暂停后续任务调度（模拟）')}
function continueRun(id){let r=getRun(id);r.state='执行中';render();toast('已恢复调度；只处理 Ready 节点（模拟）')}
function recordsPage(){return `${head('记录与治理 / 产物与事件','产物与事件','追踪需求、工作流版本、团队成员映射、任务级 CLI 分配、员工会话和执行历史。')}<div class="card pad"><h3 class="title">执行事件</h3>${runs.flatMap(r=>r.events.map(e=>({r,e}))).slice(0,20).map(x=>`<div class="item"><b>${esc(x.e[1])}</b><div class="tiny muted">${x.r.id} · ${esc(x.e[0])} · ${esc(x.e[2])}</div></div>`).join('')}</div>`}
function settingsPage(){return `${head('系统设置','设置','配置本机扫描和任务调度策略。')}<div class="grid two"><div class="card pad"><h3 class="title">Agent CLI 扫描</h3><div class="field"><label>启动扫描策略</label><select><option>每次启动快速扫描 + 手动完整扫描</option><option>仅手动扫描</option></select></div><div class="field"><label>扫描范围</label><textarea>PATH、常见安装目录、用户自定义目录</textarea></div>${btn('立即扫描','scanCli()','primary')}</div><div class="card pad"><h3 class="title">需求执行与会话策略</h3><div class="kv"><span>需求执行方案</span><b>一个 Work Item + 一个 Workflow + 一个 Team</b></div><div class="kv"><span>团队</span><b>成员名单和角色资格，不绑定工作流 / CLI</b></div><div class="kv"><span>工作流</span><b>节点、角色要求和依赖，不绑定员工</b></div><div class="kv"><span>节点执行人</span><b>从本次团队成员中映射</b></div><div class="kv"><span>CLI 选择</span><b>节点任务级，启动前完成</b></div><div class="kv"><span>会话创建</span><b>节点实际启动时按需创建 / 唤醒</b></div><div class="kv"><span>并发策略</span><b>同一员工默认串行</b></div></div></div>`}
function searchAll(v){if(!v)return;let all=[...workItems.map(x=>x.title),...teams.map(x=>x.name),...workflows.map(x=>x.name),...employees.map(x=>x.name)];let hits=all.filter(x=>x.toLowerCase().includes(v.toLowerCase()));if(hits.length)toast('匹配：'+hits.slice(0,3).join('、'))}
function openModal(html){$('#modal').innerHTML=html;$('#modalback').classList.add('show')}function closeModal(){$('#modalback').classList.remove('show')}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.classList.remove('show'),2800)}
function init(){render();setTimeout(()=>toast('启动扫描完成：本机 Agent CLI 已刷新（演示数据）'),300)}init();
</script></body></html>
