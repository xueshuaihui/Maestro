<title>Maestro V3.2 · 需求驱动的团队与工作流执行控制台</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e4e9f0;--text:#202b3a;--muted:#718096;--blue:#2563eb;--bluebg:#edf4ff;--green:#16865b;--greenbg:#eaf8f0;--amber:#a86b12;--amberbg:#fff6e5;--red:#c2413b;--redbg:#fff0ef;--purple:#7654b7;--purplebg:#f3efff;--shadow:0 2px 8px rgba(16,24,40,.04)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#1d4ed8;text-decoration:none}
.app{display:flex;min-height:100vh}.sidebar{width:238px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 4px;font-size:18px;font-weight:800}.brand .ver{font-size:10px;color:var(--blue);background:var(--bluebg);border-radius:6px;padding:2px 6px;margin-left:auto}
.brandsub{padding:0 10px 16px;font-size:10px;color:var(--muted)}
.mark{height:30px;width:30px;border-radius:9px;background:linear-gradient(145deg,#3478ef,#1d4ed8);color:#fff;display:grid;place-items:center}
.nav-label{padding:13px 11px 6px;color:#9aa4b2;font-size:10px;font-weight:800;letter-spacing:.08em}.nav{display:flex;gap:9px;align-items:center;padding:9px 11px;margin:2px 0;border-radius:8px;color:#526174;cursor:pointer;font-size:13px}.nav:hover{background:#f5f7fb}.nav.active{background:var(--bluebg);color:#1d4ed8;font-weight:700}.nav small{margin-left:auto;border-radius:20px;background:#eef2f7;padding:1px 7px;font-size:10px}
.bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;color:var(--muted);font-size:11px}
.main{flex:1;min-width:0}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;gap:14px}
.content{padding:25px 28px 55px;max-width:1560px;margin:auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.head h1{font-size:22px;line-height:1.25;margin:0 0 5px}.head h2{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #d9e1eb;background:#fff;color:#344054;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:650}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.soft{background:var(--bluebg);color:#1d4ed8;border-color:#d8e7ff}.btn.danger{color:var(--red);border-color:#f2c7c4}.btn.sm{padding:5px 9px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:14px}.two{grid-template-columns:1.15fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.pad{padding:16px}.stat{padding:15px}.stat b{display:block;font-size:24px;margin-top:3px}.stat .tiny{margin-top:6px}
.title{font-size:14px;font-weight:750;margin:0 0 12px}.muted{color:var(--muted)}.tiny{font-size:10px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;background:#eef2f7;color:#596678;font-size:10px;font-weight:700;white-space:nowrap}.green{background:var(--greenbg);color:var(--green)}.blue{background:var(--bluebg);color:#1d4ed8}.amber{background:var(--amberbg);color:var(--amber)}.red{background:var(--redbg);color:var(--red)}.purple{background:var(--purplebg);color:var(--purple)}
.table{width:100%;border-collapse:collapse}.table th{text-align:left;background:#fafbfd;color:#8793a3;font-size:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.table td{font-size:12px;padding:11px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr.click{cursor:pointer}.table tr.click:hover td{background:#fafcff}
.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#eaf1ff;color:#245fc5;font-weight:800;flex-shrink:0}.mono{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#637083;overflow-wrap:anywhere}.tag{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:#617084;display:inline-block}.pilllist{display:flex;gap:6px;flex-wrap:wrap}
.item{padding:11px 0;border-bottom:1px solid #eef1f5}.item:last-child{border-bottom:0}.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}.field label{font-size:11px;font-weight:700;color:#697789}.field input,.field select,.field textarea{border:1px solid #d9e1eb;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text);font-size:12px;width:100%}.field textarea{min-height:72px;resize:vertical}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px;padding:7px 0;border-bottom:1px solid #eef1f5;font-size:11px}.kv:last-child{border-bottom:0}
.notice{background:#eff6ff;border:1px solid #d8e7ff;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px}.notice.warn{background:#fff8eb;border-color:#f4e1b9}.notice.good{background:#effaf3;border-color:#d2eddc}.notice.bad{background:#fff0ef;border-color:#f2c7c4}
.progress{height:6px;background:#edf1f5;border-radius:12px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:#3478ef}
.flow{display:flex;align-items:stretch;gap:9px;overflow:auto;padding:5px 1px 14px}.node{min-width:192px;max-width:220px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;cursor:pointer}.node.run{border-left:3px solid var(--blue)}.node.done{border-left:3px solid var(--green)}.node.wait{border-left:3px solid #d79a28}.node.fail{border-left:3px solid var(--red)}.arrow{display:grid;place-items:center;color:#a4adba}
.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}.tab{padding:9px 11px;color:#677487;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#1d4ed8;border-color:#3478ef;font-weight:700}
.cli-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.modalback{position:fixed;inset:0;background:#0f172a55;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modalback.show{display:flex}.modal{background:#fff;border-radius:14px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px #0f172a30}.modal h3{margin:0 0 5px;font-size:17px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;right:22px;z-index:50;background:#172336;color:#fff;padding:11px 15px;border-radius:9px;font-size:12px;display:none;max-width:420px}.toast.show{display:block}
.progresslist{display:grid;gap:9px}.pstep{display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:#c1cad6;flex-shrink:0}.dot.done{background:#18a36a}
.scanlist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.empty{padding:22px;text-align:center;color:var(--muted)}
.checkrow{display:flex;align-items:flex-start;gap:9px;padding:9px;border:1px solid var(--line);border-radius:8px;margin:7px 0}.checkrow input{margin-top:3px}.stepbar{display:flex;gap:6px;margin:10px 0 18px;flex-wrap:wrap}.stepbar span{padding:6px 9px;border-radius:20px;background:#f0f2f6;color:#718096;font-size:10px}.stepbar span.on{background:var(--bluebg);color:#1d4ed8;font-weight:700}
.member{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.member .left{display:flex;align-items:center;gap:9px}
.node-map{display:grid;grid-template-columns:1.25fr 1fr 1.4fr;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #eef1f5}.node-map:last-child{border-bottom:0}
.dagcard{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;background:#fcfdff}.chain{font-size:10px;color:var(--muted);margin-top:5px}
.chip{display:inline-block;background:#f2f5f9;color:#657389;border-radius:5px;padding:2px 6px;font-size:10px;margin:2px 3px 0 0}
.flowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:8px}.flowline .step{padding:3px 8px;border-radius:6px;background:#f3f6fa;color:#68768a}
/* ---- 流程图模式 ---- */
.modal.wide{width:min(1240px,100%)}
.graph-wrap{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.graph-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--line);background:#fbfcfe}
.graph-bar .grow{flex:1;min-width:6px}.graph-bar .zoom{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#637083;min-width:42px;text-align:center}
.graph-main{display:grid;grid-template-columns:minmax(0,1fr) 288px;min-height:520px}
.graph-viewport{position:relative;overflow:auto;min-height:520px;max-height:66vh;cursor:grab;background-color:#fafcff;background-image:radial-gradient(#d8e2ef 1px,transparent 1px);background-size:20px 20px}
.graph-viewport.dragging{cursor:grabbing}
.graph-canvas{position:relative;transform-origin:0 0}
.graph-edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.graph-edges .edge{fill:none;stroke:#c4cfdd;stroke-width:1.8}
.graph-edges .edge.done{stroke:#57b28b}.graph-edges .edge.active{stroke:#6b9cf0}.graph-edges .edge.hot{stroke:#2563eb;stroke-width:3}
.graph-edges .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:help}
.graph-node-label{position:absolute;font-size:9px;font-weight:700;color:#7a6ac0;background:#f4f0ff;border:1px solid #e4dcfa;border-radius:5px;padding:1px 5px;white-space:nowrap;pointer-events:none}
.g-node{position:absolute;width:196px;min-height:96px;border:1px solid #d3dce8;border-left:4px solid #82aaf0;border-radius:10px;background:#fff;padding:9px 10px;box-shadow:0 2px 7px #0f172a12;cursor:pointer;font-size:11px}
.g-node:hover{box-shadow:0 5px 16px #2563eb22}.g-node.human{border-left-color:#9a79d8;background:#fdfbff}
.g-node.done{border-left-color:#2f9d6b}.g-node.run{border-left-color:#2563eb}.g-node.bad{border-left-color:#c2413b}.g-node.wait{border-left-color:#d79a28}
.g-node.sel{outline:2px solid #2563eb;outline-offset:2px}.g-node.dim{opacity:.38}
.g-node .gid{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b97a8}
.g-node .gt{font-size:12px;font-weight:750;line-height:1.35;margin-top:2px}
.g-node .gmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.g-node .gfoot{margin-top:7px;padding-top:6px;border-top:1px dashed #e7ecf3;color:#6d7b8e;line-height:1.45}
.graph-side{border-left:1px solid var(--line);padding:13px;background:#fff;overflow:auto;max-height:66vh}
.graph-side .kv{grid-template-columns:88px 1fr;gap:6px}
.graph-legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10px;color:#728098;padding:8px 12px;border-top:1px solid var(--line);background:#fbfcfe}
.graph-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.graph-editor-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);background:#f7f9fc}
.graph-editor-tools select{border:1px solid #d9e1eb;border-radius:7px;padding:5px 7px;font-size:11px;max-width:150px;background:#fff;color:var(--text)}
@media(max-width:1100px){.graph-main{grid-template-columns:1fr}.graph-side{border-left:0;border-top:1px solid var(--line);max-height:none}}
@media(max-width:1150px){.five{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:900px){.sidebar{width:205px}.four,.three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.sidebar{display:none}.content{padding:17px 12px}.top{padding:0 13px}.five,.four,.three,.two{grid-template-columns:1fr}.scanlist{grid-template-columns:1fr}.head{display:block}.head .actions{margin-top:12px}.node-map{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}}
</style>
</head>

<script>
/* ============================================================

             → Node Executor Plan → Workflow Run / Tasks

const clone=o=>JSON.parse(JSON.stringify(o));
const STATE={draft:'草稿',configured:'已配置',ready_to_run:'待启动',running:'执行中',waiting_human:'待人工处理',blocked:'阻塞',ready_for_acceptance:'待验收',accepted:'已验收',delivered:'已交付',cancelled:'已取消',created:'已创建',succeeded:'已完成',failed:'失败'};

 {id:'cursor',name:'Cursor Agent',version:'0.49.6',path:'/Applications/Cursor.app/Contents/Resources/app/bin/cursor-agent',protocol:'ACP / local',caps:['resume','stream','files','terminal'],available:true,health:'健康',auth:'已认证',lastScan:'今天 09:00'},
 {id:'codex',name:'Codex CLI',version:'0.2.1',path:'~/.local/bin/codex',protocol:'stdio adapter',caps:['resume','tools','files','terminal'],available:true,health:'健康',auth:'已认证',lastScan:'今天 09:00'},

function scanCli(mode){
 if(scanState.running)return toast('扫描进行中，请等待当前阶段完成');
 mode=mode||'quick';let total=mode==='full'?SCAN_PHASES.length:3;
 scanState={running:true,percent:0,phase:0,mode};
 let timer=setInterval(()=>{
  scanState.phase++;scanState.percent=Math.round(scanState.phase/total*100);
  if(page==='scan')render();
  if(scanState.phase>=total){
   clearInterval(timer);
   cliData.forEach(c=>{c.lastScan='刚刚';if(mode==='full'){c.health=c.auth==='已认证'?'健康':'认证失效';c.available=c.health==='健康';if(!c.caps.length)c.caps=['stream','files']}});
   scanState.running=false;scanState.percent=100;scanState.phase=SCAN_PHASES.length;
   if(page==='scan')render();
   toast(`扫描完成：${mode==='full'?'完整':'快速'}扫描 · ${cliData.filter(c=>c.available).length} 个 CLI 可用`);
  }
 },260);
}
function checkCli(id){
 let c=getCli(id);c.health=c.auth==='已认证'?'健康':'认证失效';c.available=c.health==='健康';c.lastScan='刚刚';render();
 toast(`${c.name} 健康检查：${c.health} · ${c.auth}（模拟探测已回写资源池）`);
}
function addCliPath(){openModal(`<h3>手动添加 CLI 路径</h3><p class="sub">添加的路径只进入本机执行资源池，不创建任何员工或团队。</p><div class="field"><label>可执行文件路径 *</label><input id="cliPathInput" placeholder="例如：/usr/local/bin/my-agent"></div><div class="notice">原型不真实探测可执行文件；新增条目为「待探测」，可通过健康检查模拟完成探测。</div><div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmAddCli()">添加并扫描</button></div>`)}
function confirmAddCli(){

function cancelWorkItem(itemId){

 setWorkItemCode(itemId,'cancelled','需求已取消');

function wizardWorkflow(){let w=workItemWizard;if(w.workflowMode==='existing')return getWF(w.workflowId);return {id:'WF-DRAFT',name:w.newWorkflowName||'新工作流',version:'1.0',status:'draft',kind:'本次需求',desc:'本次需求创建的工作流定义',nodes:w.newWorkflowNodes||makeNodesFromRoles(w.newWorkflowRoles)}}
function wizardTeam(){let w=workItemWizard;if(w.teamMode==='existing')return getTeam(w.teamId);let ids=Object.keys(w.newTeamRoles).filter(id=>w.newTeamMembers.includes(id)&&w.newTeamRoles[id]?.length);return {id:'TEAM-DRAFT',name:w.newTeamName||'新团队',version:'1.0',status:'draft',kind:'本次需求',desc:'本次需求创建的团队',members:ids.map(id=>member(id,w.newTeamRoles[id],+(w.newTeamPriority[id]||(id===ids[0]?1:3)),id===(w.newTeamPrimary||ids[0])))} }
function makeNodesFromRoles(roleIds){let nodes=[];roleIds.forEach((rid,i)=>{let deps=[];if(['fe','be'].includes(rid)){let a=nodes.find(n=>n.role==='arch');if(a)deps=[a.id]}else if(rid==='qa'){deps=nodes.filter(n=>['fe','be'].includes(n.role)).map(n=>n.id);if(!deps.length&&nodes.length)deps=[nodes[nodes.length-1].id]}else if(i>0&&!['pm','review'].includes(rid))deps=[nodes[i-1].id];nodes.push(node('N-'+rid.toUpperCase()+(i+1),getRole(rid)?.name+'任务',rid,deps))});return nodes}
function parallelPairs(nodes){let out=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],upA=graphReach(nodes,a.id,false),upB=graphReach(nodes,b.id,false);if(!upA.has(b.id)&&!upB.has(a.id))out.push([a,b])}return out}
function parallelConflicts(w,mapping){return parallelPairs(w.nodes).filter(([a,b])=>a.type==='agent'&&b.type==='agent'&&mapping[a.id]&&mapping[a.id]===mapping[b.id]).map(([a,b])=>({a,b,employeeId:mapping[a.id]}))}

  <button class="btn sm" onclick="graphZoom('${id}',-0.15)" title="缩小">−</button><span class="zoom" id="gz-${id}">${Math.round(s.zoom*100)}%</span><button class="btn sm" onclick="graphZoom('${id}',0.15)" title="放大">＋</button>

 return `<div class="graph-wrap" id="graph-${id}">${tools}<div class="graph-main"><div class="graph-viewport" id="gv-${id}" onpointerdown="graphPanStart(event,'${id}')"><div class="graph-canvas" id="gc-${id}" style="width:${info.width}px;height:${info.height}px;transform:translate(${s.panX}px,${s.panY}px) scale(${s.zoom})">

  ${labels.join('')}${nodeHTML}</div></div>${graphSidebar(id,s,ns,tmap,opts)}</div>

}
function graphRefresh(id){let c=graphCache[id],host=$('#graph-'+id);if(!c||!host)return;if(id==='wfedit'||id==='wizedit'){c.nodes=clone(wfEdit.nodes);let opts=c.nodes.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');['wfEdgeFrom','wfEdgeTo'].forEach(k=>{let sel=$('#'+k);if(sel){let cur=sel.value;sel.innerHTML=opts;if(c.nodes.some(n=>n.id===cur))sel.value=cur}})}let box=document.createElement('div');box.innerHTML=graphHTML(id,c.nodes,c.tasks,c.opts);host.replaceWith(box.firstElementChild)}
function graphSelect(id,nodeId){let s=graphState(id);s.selected=s.selected===nodeId?null:nodeId;graphRefresh(id)}
function graphZoom(id,d){let s=graphState(id);s.zoom=Math.min(2,Math.max(.5,Math.round((s.zoom+d)*100)/100));let c=$('#gc-'+id);if(c)c.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.zoom})`;let z=$('#gz-'+id);if(z)z.textContent=Math.round(s.zoom*100)+'%'}
function graphToggle(id,prop){let s=graphState(id);s[prop]=!s[prop];graphRefresh(id)}
function graphFit(id){let s=graphState(id),info=graphDagInfo(graphCache[id].nodes),v=$('#gv-'+id);let vw=v?.clientWidth||820,vh=v?.clientHeight||520;s.zoom=Math.max(.5,Math.min(1,Math.round(Math.min((vw-36)/info.width,(vh-36)/info.height)*100)/100));s.panX=0;s.panY=0;let c=$('#gc-'+id);if(c)c.style.transform=`translate(0px,0px) scale(${s.zoom})`;let z=$('#gz-'+id);if(z)z.textContent=Math.round(s.zoom*100)+'%'}
function graphPanStart(ev,id){if(ev.button!==0||ev.target.closest('.g-node')||ev.target.closest('.graph-bar')||ev.target.closest('.graph-side'))return;let s=graphState(id);graphDrag={id,sx:ev.clientX,sy:ev.clientY,px:s.panX,py:s.panY};document.addEventListener('pointermove',graphPanMove);document.addEventListener('pointerup',graphPanEnd)}
function graphPanMove(ev){if(!graphDrag)return;let s=graphState(graphDrag.id);s.panX=graphDrag.px+ev.clientX-graphDrag.sx;s.panY=graphDrag.py+ev.clientY-graphDrag.sy;let c=$('#gc-'+graphDrag.id);if(c)c.style.transform=`translate(${s.panX}px,${s.panY}px) scale(${s.zoom})`}
function graphPanEnd(){graphDrag=null;document.removeEventListener('pointermove',graphPanMove);document.removeEventListener('pointerup',graphPanEnd)}

function showWorkflowDag(id,mode){

function newEmployee(){openModal(`<h3>创建员工档案</h3><p class="sub">只建立身份和角色资格。不绑定 CLI，不加入团队，不创建会话。</p><div class="field"><label>员工名称 *</label><input id="empName" placeholder="例如：产品经理-02"></div><div class="field"><label>职务说明</label><input id="empTitle" placeholder="例如：需求分析专员"></div><label class="tiny muted">全局角色资格</label>${roles.map(r=>`<label class="checkrow"><input type="checkbox" class="empRole" value="${r.id}"><span><b>${r.name}</b><div class="tiny muted">${r.desc}</div></span></label>`).join('')}<div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEmployee()">创建员工</button></div>`)}
function saveEmployee(){let name=$('#empName').value.trim();if(!name)return toast('请填写员工名称');let id=nextId('EMP-',employees);employees.push({id,name,title:$('#empTitle').value.trim(),roles:[...document.querySelectorAll('.empRole:checked')].map(x=>x.value),enabled:true});closeModal();render();toast('员工档案已创建：无 CLI 绑定、无团队归属、无会话')}

function toggleEmployee(id){
 let e=getEmp(id);e.enabled=!e.enabled;
 let affected=[],interrupted=[];
 workItems.forEach(item=>{
  let r=getRunForItem(item.id);if(!r)return;
  r.tasks.forEach(t=>{
   if(t.plannedEmployeeId!==id&&t.employeeId!==id)return;
   if(t.state==='running'){interruptTask(r.id,t.id);interrupted.push(t.name)}
   else if(['ready','assignment_prepared','waiting_dependency','waiting_queue'].includes(t.state)){
    let cand=eligibleMembers(item.teamSnapshot,t.role)[0];
    t.plannedEmployeeId=cand?.employeeId||null;
    if(t.assignment){t.assignment.employeeId=t.plannedEmployeeId;t.assignment.history.push('执行人停用 → 需重新映射')}
    t.activity='原计划执行人已停用，需重新映射或改派';
    affected.push(t.name);
   }
  });
 });
 if(affected.length)auditAdd('执行人重映射',`${e.name} 停用：未启动节点 ${affected.join('、')} 已清除原映射并提示重新分配`,'');
 if(interrupted.length)auditAdd('异常恢复',`${e.name} 停用：运行中节点 ${interrupted.join('、')} 已中断，走恢复流程`,'');
 render();toast(`${e.name} 已${e.enabled?'启用':'停用'}；${affected.length} 个未启动节点需重新映射${interrupted.length?'，'+interrupted.length+' 个运行节点已中断':''}`);
}

 let e=getEmp(id),s=getSession(id),memberships=teams.filter(t=>t.members.some(m=>m.employeeId===id));
 openModal(`<h3>${esc(e.name)} · 员工档案</h3><p class="sub">${e.id} · ${badge(e.enabled?'succeeded':'failed',{succeeded:'启用',failed:'停用'})}</p>
 <div class="kv"><span>职务</span><b>${esc(e.title||'—')}</b></div><div class="kv"><span>全局角色资格</span><b>${e.roles.map(r=>getRole(r)?.name).join('、')||'未配置'}</b></div><div class="kv"><span>CLI 绑定</span><b>无；CLI 只在节点任务级选择</b></div><div class="kv"><span>Team ID</span><b>不保存在员工档案；仅只读汇总</b></div><div class="kv"><span>所属团队</span><b>${memberships.map(t=>esc(t.name)).join('、')||'无'}</b></div><div class="kv"><span>Employee Session</span><b class="mono">${s?s.id:'首次实际执行任务时按需创建'}</b></div>
 <h4 style="margin:14px 0 6px">宿主会话绑定历史（按 CLI 维护）</h4>${s?s.hosts.map(h=>`<div class="item"><b>${esc(getCli(h.cliId)?.name)}</b><div class="mono">${esc(h.hostSessionId)} · ${esc(h.status)} · ${esc(h.last)}</div><div class="tiny muted">跨 CLI 不直接复用 Host Session ID</div></div>`).join(''):'<div class="empty">尚无会话。创建员工 / 加入团队 / 创建需求都不创建会话。</div>'}
 <div class="foot"><button class="btn" onclick="closeModal()">关闭</button>${btn('编辑档案',`editEmployeeProfile('${id}')`,'primary')}</div>`)

function editEmployeeProfile(id){let e=getEmp(id);openModal(`<h3>编辑员工档案 · ${esc(e.name)}</h3><p class="sub">只维护身份与全局角色资格，不绑定 CLI、团队或会话。</p><div class="field"><label>员工名称 *</label><input id="empName" value="${esc(e.name)}"></div><div class="field"><label>职务说明</label><input id="empTitle" value="${esc(e.title||'')}"></div><label class="tiny muted">全局角色资格</label>${roles.map(r=>`<label class="checkrow"><input type="checkbox" class="empRole" value="${r.id}" ${e.roles.includes(r.id)?'checked':''}><span><b>${r.name}</b><div class="tiny muted">${esc(r.desc)}</div></span></label>`).join('')}<div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEmployeeProfile('${id}')">保存档案</button></div>`)}
function saveEmployeeProfile(id){let e=getEmp(id),name=$('#empName').value.trim();if(!name)return toast('请填写员工名称');let newRoles=[...document.querySelectorAll('.empRole:checked')].map(x=>x.value);teams.forEach(t=>t.members.forEach(m=>{if(m.employeeId===id)m.roles=m.roles.filter(r=>newRoles.includes(r))}));e.name=name;e.title=$('#empTitle').value.trim();e.roles=newRoles;closeModal();render();toast('员工档案已保存；团队内超出新资格的角色已同步收敛')}

function runsPage(){
 let all=runs.flatMap(r=>r.tasks);
 return `${head('执行管理 / 执行中心','执行中心','从需求执行方案进入每个 Run。节点执行者来自本次团队；CLI 在任务进入 Ready 后选择，会话在启动时才创建。',btn('查看需求 / 任务',"nav('workitems')",'primary'))}
 <div class="grid five">

  <div class="card stat"><div class="muted tiny">Ready 节点</div><b style="color:var(--blue)">${all.filter(t=>t.state==='ready').length}</b></div>

 </div>
 <div class="card" style="margin-top:15px"><table class="table"><thead><tr><th>需求 / 任务</th><th>工作流版本</th><th>团队版本</th><th>状态</th><th>进度</th><th></th></tr></thead><tbody>

 </tbody></table></div>${getRun(activeRun)?runDetail(getRun(activeRun)):''}`

function openRun(id){activeRun=id;page='runs';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='runs'));render();setTimeout(()=>$('#runDetail')?.scrollIntoView({behavior:'smooth'}),25)}
function setRunTab(t){runTab=t;render();setTimeout(()=>$('#runDetail')?.scrollIntoView({behavior:'smooth'}),20)}
function runRuntimeCards(r){
 return `<div class="grid two" style="margin-top:14px"><div class="card pad"><h3 class="title">员工执行活动（公开事件）</h3>${r.tasks.filter(t=>['running','interrupted'].includes(t.state)).map(t=>`<div class="item"><div class="between"><b>${esc(getEmp(t.employeeId)?.name)}</b>${badge(t.state,TASK_STATE)}</div><div class="tiny muted">${esc(t.name)} · ${getCli(t.cliId)?.name} · Attempt ${t.attempt}</div><div>${esc(t.activity)}</div><div class="mono">${t.employeeSessionId||'—'} / ${t.hostSessionId||'—'}</div><div>${btn('活动面板',`activityPanel('${r.id}','${t.id}')`,'sm soft')}</div></div>`).join('')||'<div class="empty">当前没有活跃员工任务</div>'}</div>
 <div class="card pad"><h3 class="title">按需创建的员工会话</h3>${[...new Set(r.tasks.filter(t=>t.employeeSessionId).map(t=>t.employeeId))].map(eid=>{let s=getSession(eid);return `<div class="item"><b>${esc(getEmp(eid)?.name)}</b><div class="mono">Employee Session: ${esc(s?.id)}</div>${(s?.hosts||[]).map(h=>`<div class="tiny muted">${esc(getCli(h.cliId)?.name)}: ${esc(h.hostSessionId)} · ${esc(h.status)}</div>`).join('')}</div>`}).join('')||'<div class="empty">尚无会话。节点启动后才创建。</div>'}</div></div>`

function runDetail(r){
 let item=getItem(r.workItemId),done=r.tasks.filter(t=>t.state==='succeeded').length;
 let tabs=`<div class="tabs"><div class="tab ${runTab==='graph'?'active':''}" onclick="setRunTab('graph')">流程图模式</div><div class="tab ${runTab==='flow'?'active':''}" onclick="setRunTab('flow')">线性视图</div><div class="tab ${runTab==='tasks'?'active':''}" onclick="setRunTab('tasks')">任务表格</div><div class="tab ${runTab==='events'?'active':''}" onclick="setRunTab('events')">事件时间线</div></div>`;
 let body='';
 if(runTab==='graph'){
  body=`${graphHTML('run-'+r.id,graphNodesFromRun(r),r.tasks,{runId:r.id})}${runRuntimeCards(r)}`;
 }
 if(runTab==='flow'){
  body=`<div class="card pad"><h3 class="title">工作流执行视图 · 节点执行者来自本次团队</h3><div class="flow">${r.tasks.map((t,i)=>`${i?'<div class="arrow">→</div>':''}<div class="node ${t.state==='succeeded'?'done':t.state==='running'?'run':['interrupted','failed'].includes(t.state)?'fail':'wait'}" onclick="taskDetail('${r.id}','${t.id}')"><div class="between"><b>${esc(t.name)}</b>${badge(t.state,TASK_STATE)}</div><div class="tiny muted" style="margin-top:6px">${t.role?getRole(t.role)?.name:'人工节点'} · ${t.nodeId}</div><div style="margin-top:8px"><span class="tiny muted">计划执行人：</span><b>${getEmp(t.plannedEmployeeId)?.name||'待分配'}</b></div><div class="tiny muted">实际执行员工：${getEmp(t.employeeId)?.name||'尚未启动'}</div><div class="tiny muted">${t.cliId?getCli(t.cliId)?.name:'未选择 CLI'}</div><div class="tiny muted">${t.employeeSessionId?'Session 已创建':'Session 尚未创建'}</div><div class="tiny muted">${esc(t.activity)}</div></div>`).join('')}</div></div>${runRuntimeCards(r)}`;
 }
 if(runTab==='tasks'){

 }

 }
 return `<section id="runDetail" style="margin-top:16px"><div class="head"><div><h2>${esc(r.title)}</h2><div class="sub">${r.id} · workflow v${r.workflowVersion} · team v${r.teamVersion} · 快照来自 ${esc(item?.id||'—')}</div></div><div class="actions">${btn('查看需求',"openWorkItem('"+r.workItemId+"')")}${btn('事件时间线',`showEvents('${r.id}')`)}${btn('暂停调度',`pauseRun('${r.id}')`)}${btn('继续调度',`continueRun('${r.id}')`,'soft')}${['ready_for_acceptance','accepted'].includes(r.code)?btn('交付验收',`openDelivery('${r.id}')`,'primary'):''}</div></div>
 <div class="notice"><b>职责分工：</b>工作流声明节点角色；团队提供成员；Node Executor Plan 固定本次映射；节点 Ready 后任务级选员工与 CLI；启动才创建会话。</div>
 ${tabs}${body}</section>`
}
function taskActionBtn(r,t){
 if(t.type==='human'&&t.state==='human_waiting')return btn('批准',`approveHumanTask('${r.id}','${t.id}')`,'sm primary');
 if(t.state==='ready')return btn('分配执行',`assignTask('${r.id}','${t.id}')`,'sm primary');
 if(t.state==='assignment_prepared')return btn('修改 / 启动',`assignTask('${r.id}','${t.id}')`,'sm');
 if(t.state==='running')return btn('详情',`taskDetail('${r.id}','${t.id}')`,'sm');
 if(t.state==='interrupted')return btn('恢复',`resumeTask('${r.id}','${t.id}')`,'sm soft');
 return btn('详情',`taskDetail('${r.id}','${t.id}')`,'sm');
}

/* ==================== P12 节点分配面板 ==================== */
function assignTask(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),item=getItem(r.workItemId),team=item.teamSnapshot;
 let candidates=eligibleMembers(team,t.role);
 if(!candidates.length)return toast('团队中没有符合该节点角色要求的成员：请编辑团队或调整本次执行人映射');
 let chosen=t.employeeId||t.plannedEmployeeId||candidates[0].employeeId,cli=t.cliId||cliData.find(c=>cliMeetsNode(c,nodeForTask(runId,t)))?.id||'';
 openModal(`<h3>节点任务分配 · ${esc(t.name)}</h3><p class="sub">${t.id} · ${t.nodeId} · 角色要求：${t.role?getRole(t.role)?.name:'人工节点'}</p>
 <div class="notice">执行者必须来自本次需求绑定的团队。CLI 只在此节点任务级选择；保存 Prepared 不创建 Employee Session 与 Host Session，且仍可修改员工 / CLI。</div>
 <div class="grid two"><div><div class="field"><label>团队执行成员（符合角色要求）</label><select id="taskEmployee">${candidates.map(m=>`<option value="${m.employeeId}" ${m.employeeId===chosen?'selected':''}>${esc(getEmp(m.employeeId)?.name)} · P${m.priority}${m.primary?' · 主成员':''}</option>`).join('')}</select></div><div class="field"><label>工作目录</label><input id="taskWorkspace" value="${esc(t.assignment?.workspace||('~/workspace/'+r.workItemId.toLowerCase()))}"></div></div>
 <div><div class="field"><label>本机 Agent CLI 候选（能力 / 健康 / 认证）</label><select id="taskCli">${cliData.map(c=>`<option value="${c.id}" ${c.id===cli?'selected':''} ${cliMeetsNode(c,nodeForTask(runId,t))?'':'disabled'}>${esc(c.name)} · v${c.version} · ${esc(c.protocol)} · ${c.available?esc(c.health):'不可用'}${cliMeetsNode(c,nodeForTask(runId,t))?'':' · 能力不符'}</option>`).join('')}</select></div><div class="field"><label>当前 Assignment 状态</label><input value="${t.assignment?label(ASG_STATE,t.assignment.state):ASG_STATE.draft}" disabled></div></div></div>
 <div class="card pad"><div class="tiny muted">CLI 能力详情</div><div id="cliCaps" class="pilllist">${cliCapsHtml(cli)}</div><div class="field" style="margin-top:8px"><label>权限快照（随 Assignment 固化）</label><div class="row">${[['read','read:workspace'],['write','write:workspace'],['terminal','terminal:exec'],['network','network:outbound']].map(([k,v])=>`<label class="tiny muted"><input type="checkbox" class="asgPerm" value="${v}" ${(t.assignment?.permissions||['read:workspace','write:workspace']).includes(v)?'checked':''}> ${v}</label>`).join('')}</div></div><div class="tiny muted">输入产物引用：${esc(t.assignment?.inputRefs?.join('、')||'节点上游产物')}</div></div>
 <div class="notice good" id="sessionExplain" style="margin-top:12px">${sessionExplain(chosen,cli)}</div>
 <div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn soft" onclick="saveTaskAssignment('${runId}','${taskId}',false)">保存 Prepared</button><button class="btn primary" onclick="saveTaskAssignment('${runId}','${taskId}',true)">保存并启动节点</button></div>`);
 $('#taskEmployee').onchange=()=>{$('#sessionExplain').textContent=sessionExplain($('#taskEmployee').value,$('#taskCli').value)};
 $('#taskCli').onchange=()=>{$('#cliCaps').innerHTML=cliCapsHtml($('#taskCli').value);$('#sessionExplain').textContent=sessionExplain($('#taskEmployee').value,$('#taskCli').value)};
}
function cliCapsHtml(id){let c=getCli(id);return c?`${c.caps.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="tag">认证：${esc(c.auth)}</span><span class="tag">健康：${esc(c.health)}</span>`:'—'}
function sessionExplain(empId,cliId){
 let s=getSession(empId),c=getCli(cliId),binding=s?.hosts.slice().reverse().find(h=>h.cliId===cliId);
 if(!s)return `员工 ${esc(getEmp(empId)?.name)} 尚无 Employee Session。启动时先创建员工逻辑会话，再为 ${esc(c?.name||'所选 CLI')} 创建 Host Session Binding。`;
 if(binding&&c?.caps.includes('resume'))return `已有 Employee Session 与 ${esc(c.name)} 的宿主映射。启动时检查兼容性与可恢复状态，优先唤醒 / 恢复该 Host Session。`;
 return `沿用 Employee Session ID，为 ${esc(c?.name||'所选 CLI')} 新建 Host Session Binding；不跨 CLI 复用 Host Session ID。`;
}

function saveTaskAssignment(runId,taskId,startNow){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),item=getItem(r.workItemId),team=item.teamSnapshot;
 let employeeId=$('#taskEmployee').value,cliId=$('#taskCli').value,c=getCli(cliId);
 if(!eligibleMembers(team,t.role).some(m=>m.employeeId===employeeId))return toast('所选员工不是本次团队中符合角色要求的成员');
 if(!cliMeetsNode(c,nodeForTask(runId,t)))return toast('CLI 不可用或能力不满足节点要求，请重新选择');
 let occupied=runs.flatMap(x=>x.tasks).find(x=>x.employeeId===employeeId&&x.state==='running'&&x.id!==taskId);
 let asg=t.assignment||{id:'ASG-'+String(r.tasks.indexOf(t)+1).padStart(3,'0'),history:[]};
 asg.employeeId=employeeId;asg.cliId=cliId;asg.workspace=$('#taskWorkspace').value.trim();asg.fingerprint=c.name+'@'+c.version+':'+c.protocol;asg.permissions=[...document.querySelectorAll('.asgPerm:checked')].map(x=>x.value);asg.inputRefs=t.deps.length?t.deps.map(d=>d+' 产物'):[item.id+'.attachments'];
 if(asg.state!=='prepared')asg.history.push(asg.state?'prepared → updated':'draft → prepared');
 asg.state='prepared';
 t.assignment=asg;t.employeeId=employeeId;t.cliId=cliId;t.state='assignment_prepared';t.activity='已保存 Prepared；员工与 CLI 可修改，尚未创建会话';
 eventAdd(r,'节点任务分配 Prepared',`${t.name} → ${esc(getEmp(employeeId)?.name)} + ${esc(c.name)}；未创建 Session`);
 if(occupied){
  render();
  openModal(`<h3>同一员工占用 · ${esc(t.name)}</h3><p class="sub">${esc(getEmp(employeeId)?.name)} 正在执行「${esc(occupied.name)}」。同一员工同一时间只执行一个前台任务，不并发写入同一 Employee Session。</p><div class="notice warn"><b>两种处置方式</b><div class="sub">改派给其他合格成员，或保留本次映射并确认排队，由 Scheduler 在前序任务释放后派发。</div></div><div class="foot"><button class="btn" onclick="reassignTask('${runId}','${taskId}')">改派其他成员</button><button class="btn primary" onclick="confirmQueue('${runId}','${taskId}')">保留并排队</button></div>`);
  return;
 }
 closeModal();render();if(startNow)startTask(runId,taskId);else toast('Prepared 已保存：员工 / CLI 可修改，没有创建员工会话');
}
function reassignTask(runId,taskId){closeModal();assignTask(runId,taskId)}
function confirmQueue(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);
 t.state='waiting_queue';t.activity='同一员工串行排队；等待前序任务释放后由 Scheduler 派发';
 eventAdd(r,'节点进入串行队列',`${t.name} · 保留 Prepared 映射，不创建 Session`);
 closeModal();render();toast('已确认排队：节点保持 Prepared 分配，等待调度');
}
function drainQueue(r){
 r.tasks.filter(t=>t.state==='waiting_queue').forEach(t=>{
  let busy=runs.flatMap(x=>x.tasks).some(x=>x.employeeId===t.employeeId&&x.state==='running'&&x.id!==t.id);
  if(!busy){t.state='assignment_prepared';t.activity='前序任务已释放，排队结束，可启动';eventAdd(r,'排队节点就绪',`${t.name} · 员工空闲`)}
 })
}


function startTask(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);
 if(!t.employeeId||!t.cliId)return toast('请先完成团队成员与 CLI 分配');
 let cli=getCli(t.cliId),node=nodeForTask(runId,t);
 if(!cliMeetsNode(cli,node)){
  if(t.assignment){t.assignment.state='failed';t.assignment.history.push('prepared → failed')}
  t.state='failed';t.activity='启动预检失败：CLI 不可用或能力不满足节点要求';
  eventAdd(r,'启动预检失败',`${t.name} · Assignment failed；请重新 Prepared`);
  render();toast('启动预检失败：Assignment 已置 failed，请重新分配');return;
 }
 let occupied=runs.flatMap(x=>x.tasks).find(x=>x.employeeId===t.employeeId&&x.state==='running'&&x.id!==taskId);
 if(occupied)return toast(`员工被任务 ${esc(occupied.name)} 占用，请改派或确认排队`);
 if(t.assignment){t.assignment.state='preflight';t.assignment.history.push('prepared → preflight')}
 t.state='preflight';t.activity='启动预检：员工可用性 / CLI 能力与状态检查';
 eventAdd(r,'节点启动预检',`${t.name} · ${esc(cli.name)} 检查通过`);
 if(t.assignment){t.assignment.state='locked';t.assignment.history.push('preflight → locked')}
 t.state='creating_session';t.activity='正在创建 / 唤醒 Employee Session 与 Host Session';
 eventAdd(r,'创建会话',`${t.name} · Employee / Host Session 按需创建`);
 let s=getSession(t.employeeId);
 if(!s){s={employeeId:t.employeeId,id:'emp_sess_'+Math.random().toString(16).slice(2,9),status:'idle',hosts:[]};employeeSessions.push(s);eventAdd(r,'创建 Employee Session',`${esc(getEmp(t.employeeId)?.name)} · ${s.id}`)}
 let h=s.hosts.slice().reverse().find(x=>x.cliId===t.cliId&&['空闲，可复用','中断，可恢复'].includes(x.status));
 let reused=!!h&&cli.caps.includes('resume');
 if(!reused){h={cliId:t.cliId,hostSessionId:'host_'+Math.random().toString(16).slice(2,9),status:'活动中',last:'刚刚',resumable:cli.caps.includes('resume')};s.hosts.push(h)}else{h.status='活动中';h.last='刚刚';h.resumable=false}
 t.employeeSessionId=s.id;t.hostSessionId=h.hostSessionId;t.state='running';t.attempt++;t.startedAt='刚刚';t.activity=(reused?'唤醒 / 复用':'创建')+' Host Session，正在执行任务';
 t.attempts.push({id:'ATT-'+String(t.attempt).padStart(3,'0'),state:'running',start:'刚刚',end:null,resumeFrom:null,checkpoint:'执行中，尚无检查点'});
 s.status='active';r.code='running';
 eventAdd(r,'节点启动',`${t.name} · ${esc(getEmp(t.employeeId)?.name)} · ${esc(cli.name)} · Attempt ${t.attempt} · Assignment locked`);
 setWorkItemCode(r.workItemId,'running',`${t.name} 节点启动`);
 render();toast('节点已启动：Assignment 经 preflight 到 locked，会话按需创建 / 唤醒（模拟）');
}

 <div class="grid two"><div class="card pad"><div class="kv"><span>所属需求</span><b>${esc(r.title)}</b></div><div class="kv"><span>所属团队</span><b>${esc(team.name||'—')}</b></div><div class="kv"><span>节点 / Role</span><b>${esc(t.name)} · ${t.role?getRole(t.role)?.name:'人工'}</b></div><div class="kv"><span>团队内角色</span><b>${(team.members.find(m=>m.employeeId===t.employeeId)?.roles||[]).map(x=>getRole(x)?.name).join('、')||'—'}</b></div><div class="kv"><span>本次 CLI</span><b>${esc(getCli(t.cliId)?.name||'—')}</b></div><div class="kv"><span>Employee Session</span><b class="mono">${esc(s?.id||'尚未创建')}</b></div><div class="kv"><span>Host Session</span><b class="mono">${esc(t.hostSessionId||'尚未创建')}</b></div><div class="kv"><span>当前 Attempt / 开始</span><b>${t.attempt||0} · ${esc(t.startedAt||'—')}</b></div><div class="kv"><span>运行时长</span><b>${t.startedAt&&['running','interrupted'].includes(t.state)?'约 12 分钟（模拟）':'—'}</b></div><div class="kv"><span>状态</span><b>${badge(t.state,TASK_STATE)}</b></div></div>
 <div class="card pad"><h3 class="title">公开活动流（${pub.length}）</h3>${pub.map(p=>`<div class="item"><b>${p.type}</b><div class="tiny muted">${esc(p.text)}</div></div>`).join('')}<div class="notice" style="margin-top:10px">活动流由事件时间线、Attempt 与产物引用生成；私有推理链路不对外暴露。</div></div></div>

function completeTask(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);if(!t||t.state!=='running')return;
 t.state='succeeded';t.activity='节点产物已提交';
 if(t.assignment){t.assignment.state='released';t.assignment.history.push('locked → released')}
 let cur=t.attempts[t.attempts.length-1];if(cur){cur.state='succeeded';cur.end='刚刚';cur.checkpoint='产物已入库'}
 let s=getSession(t.employeeId);if(s){s.status='idle';let h=s.hosts.find(x=>x.hostSessionId===t.hostSessionId);if(h){h.status='空闲，可复用';h.last='刚刚';h.resumable=true}}
 let aid=nextId('ART-',artifacts);
 artifacts.push({id:aid,name:t.name+' 产物 · '+t.id,kind:'节点产物',workItemId:r.workItemId,runId,taskId:t.id,nodeId:t.nodeId,employeeId:t.employeeId,cliId:t.cliId,attempt:t.attempt,handoff:'→ 下游节点',created:'刚刚'});
 t.artifacts.push(aid);
 unlockDownstream(r,t);drainQueue(r);
 let done=r.tasks.filter(x=>x.state==='succeeded').length;r.progress=Math.round(done/r.tasks.length*100);
 eventAdd(r,'节点完成',`${t.name} 完成；产物 ${aid} 入库；调度器检查依赖`);
 if(r.tasks.every(x=>x.state==='succeeded')){r.code='ready_for_acceptance';setWorkItemCode(r.workItemId,'ready_for_acceptance','全部节点完成，等待交付验收');eventAdd(r,'全部节点完成','等待交付验收')}
 closeModal();render();toast('节点完成；符合依赖的后续节点已解锁（模拟）');
}
function unlockDownstream(r,t){
 r.tasks.forEach(c=>{
  if(c.state==='waiting_dependency'&&(c.deps||[]).every(d=>r.tasks.some(z=>z.nodeId===d&&z.state==='succeeded'))){
   c.state=c.type==='human'?'human_waiting':'ready';
   c.activity=c.type==='human'?'上游完成，等待人工处理':'上游依赖满足，等待团队成员与 CLI 分配';
  }
 });
}
function interruptTask(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);t.state='interrupted';t.activity='Agent 宿主连接中断，等待恢复';
 let cur=t.attempts[t.attempts.length-1];if(cur){cur.state='interrupted';cur.end='刚刚';cur.checkpoint=cur.checkpoint||'中断前状态已保存'}
 let s=getSession(t.employeeId);if(s){s.status='interrupted';let h=s.hosts.find(x=>x.hostSessionId===t.hostSessionId);if(h){h.status='中断，可恢复';h.resumable=true}}
 r.code='running';eventAdd(r,'节点中断',`${t.name} · 保留 Assignment / Attempt / Employee Session / Host Session 引用`);
 auditAdd('异常恢复',`${r.id} ${t.name} 中断，会话引用保留`,r.workItemId);
 closeModal();render();toast('节点已中断；会话引用与检查点已保留');
}
function approveHumanTask(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);
 if(!t||t.type!=='human'||t.state!=='human_waiting')return;
 let wfNode=getItem(r.workItemId)?.workflowSnapshot?.nodes.find(n=>n.id===t.nodeId)||{};
 let approver=wfNode.approverType==='employee'&&wfNode.approverId?wfNode.approverId:'当前用户（模拟）';
 if(wfNode.approverType==='employee'&&wfNode.approverId)return toast('当前用户不是指定审批人 '+wfNode.approverId+'；请切换用户或清空指定审批人（模拟约束）');
 t.state='succeeded';t.activity='人工审批已通过（'+approver+'）；未分配员工、CLI 或会话';
 unlockDownstream(r,t);
 eventAdd(r,'人工节点批准',t.name+' 已批准；无 CLI 分配、无 Employee Session');
 auditAdd('人工审批',`${r.id} ${t.name} 由 ${approver} 批准；条件：${esc(wfNode.humanCondition||'人工确认后放行')}；无 CLI / Session`,r.workItemId);
 if(r.tasks.every(x=>x.state==='succeeded')){r.code='ready_for_acceptance';setWorkItemCode(r.workItemId,'ready_for_acceptance','全部节点完成，等待交付验收')}else if(r.tasks.some(x=>x.type==='human'&&x.state==='human_waiting'))setWorkItemCode(r.workItemId,'waiting_human','仍有人工节点待处理');
 closeModal();render();toast('人工节点已批准，工作流继续推进（模拟）');
}

function resumeTask(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),s=getSession(t.employeeId),c=getCli(t.cliId);
 let binding=s?.hosts.find(h=>h.hostSessionId===t.hostSessionId),cur=t.attempts[t.attempts.length-1];
 openModal(`<h3>中断恢复 · ${esc(t.name)}</h3><p class="sub">${t.id} · ${getEmp(t.employeeId)?.name} · ${badge(t.state,TASK_STATE)}</p>
 <div class="grid two"><div class="card pad"><div class="kv"><span>Work Item / Run / Task</span><b>${r.workItemId} / ${r.id} / ${t.id}</b></div><div class="kv"><span>Assignment ID</span><b>${esc(t.assignment?.id||'—')}</b></div><div class="kv"><span>Employee ID</span><b>${esc(t.employeeId||'—')}</b></div><div class="kv"><span>Employee Session ID</span><b class="mono">${esc(s?.id||'—')}</b></div><div class="kv"><span>Attempt ID</span><b>${esc(cur?.id||'—')}</b></div></div>
 <div class="card pad"><div class="kv"><span>原 CLI</span><b>${esc(c?.name||'—')}</b></div><div class="kv"><span>Host Session ID</span><b class="mono">${esc(t.hostSessionId||'—')}</b></div><div class="kv"><span>恢复能力</span><b>${binding?.resumable&&c?.caps.includes('resume')?'支持恢复':'需通过检查点重建'}</b></div><div class="kv"><span>最后活动</span><b>${esc(t.activity)}</b></div><div class="kv"><span>检查点</span><b>${esc(cur?.checkpoint||'—')}</b></div><div class="kv"><span>已生成产物</span><b>${t.artifacts.length?t.artifacts.map(a=>`<a href="javascript:void(0)" onclick="closeModal();artifactTrace('${a}')">${esc(a)}</a>`).join('、'):'无'}</b></div></div></div>
 <div class="field"><label>恢复策略</label><select id="resumeCli"><option value="${t.cliId}" ${binding?.resumable&&c?.caps.includes('resume')?'':'disabled'}>A · 恢复原 Host Session（继续原 Attempt）${binding?.resumable&&c?.caps.includes('resume')?'':' · 原宿主不可恢复'}</option>${cliData.filter(x=>x.available&&x.id!==t.cliId).map(x=>`<option value="${x.id}" ${cliMeetsNode(x,nodeForTask(runId,t))?'':'disabled'}>B · 改用 ${esc(x.name)}，通过检查点恢复${cliMeetsNode(x,nodeForTask(runId,t))?'':' · 能力不符'}</option>`).join('')}</select></div>
 <div class="notice warn"><b>跨 CLI 不直接复用 Host Session ID。</b><div class="sub">策略 B 会沿用 Employee Session ID，创建新的 Host Session Binding 和新的 Attempt，并关联 Resumed From Attempt ID。恢复失败时保持中断状态，不伪造成功。</div></div>
 <div class="foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="failResume('${runId}','${taskId}')">模拟恢复失败</button><button class="btn primary" onclick="confirmResume('${runId}','${taskId}')">提交恢复</button></div>`)
}

function failResume(runId,taskId,reason){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId);
 let why=reason||'宿主会话不可用';
 t.state='interrupted';t.activity='恢复失败：'+why+'；保持中断状态';
 eventAdd(r,'恢复失败',`${t.name} · ${why} · 保持中断，可继续诊断或改派`);
 auditAdd('异常恢复',`${r.id} ${t.name} 恢复失败：${why}`,r.workItemId);
 closeModal();render();toast('恢复失败：任务保持中断，未伪造恢复成功');
}


function confirmResume(runId,taskId){
 let r=getRun(runId),t=r.tasks.find(x=>x.id===taskId),newCli=$('#resumeCli').value,c=getCli(newCli),s=getSession(t.employeeId),cur=t.attempts[t.attempts.length-1];
 let binding=s?.hosts.find(h=>h.cliId===newCli&&h.hostSessionId===t.hostSessionId&&h.resumable);
 if(newCli===t.cliId){
  // 策略 A：只允许恢复原宿主。任何前置条件不满足都必须保持中断，不得静默降级为策略 B。
  if(!c?.available||!c.caps.includes('resume')||!binding)return failResume(runId,taskId,'策略 A 失败：原宿主映射不存在 / CLI 不支持 resume / CLI 不可用；请改选策略 B 或重新诊断');
  cur.state='running';cur.end=null;cur.checkpoint=cur.checkpoint||'原宿主恢复后继续执行';
  binding.status='活动中';binding.last='刚刚';binding.resumable=false;s.status='active';
  t.activity='恢复原 Host Session，继续原 Attempt';
  eventAdd(r,'节点恢复',`${t.name} · 原 Host Session ${t.hostSessionId} 恢复 · 继续 ${cur.id}`);
  auditAdd('异常恢复',`${r.id} ${t.name} 策略 A 恢复原宿主，继续 ${cur.id}`,r.workItemId);
 }else{
  // 策略 B：检查点重建，沿用 Employee Session，新建 Host Binding 与 Attempt。
  if(!c?.available||!cliMeetsNode(c,nodeForTask(runId,t)))return failResume(runId,taskId,`策略 B 失败：${c?.name||'目标 CLI'} 不可用或能力不满足节点要求；保持中断`);
  let h={cliId:newCli,hostSessionId:'host_'+Math.random().toString(16).slice(2,9),status:'活动中',last:'刚刚',resumable:c.caps.includes('resume')};
  s.hosts.push(h);
  let a={id:'ATT-'+String(t.attempt+1).padStart(3,'0'),state:'running',start:'刚刚',end:null,resumeFrom:cur?.id||null,checkpoint:'已从检查点恢复：'+(cur?.checkpoint||'无')};
  t.attempts.push(a);t.attempt++;t.hostSessionId=h.hostSessionId;t.activity='通过检查点恢复，创建新 Host Session / Attempt';
  eventAdd(r,'节点恢复',`${t.name} · ${c.name} · 新 Attempt ${a.id} 关联原 ${cur?.id||'—'}`);
  auditAdd('异常恢复',`${r.id} ${t.name} 策略 B 跨 CLI 恢复，新 Attempt ${a.id}`,r.workItemId);
  cur.state='interrupted';
 }
 t.cliId=newCli;t.employeeSessionId=s.id;t.state='running';t.startedAt='刚刚';s.status='active';r.code='running';
 setWorkItemCode(r.workItemId,'running',`${t.name} 恢复执行`);
 closeModal();render();toast('恢复完成（模拟）；Employee Session ID 保持不变，策略严格按所选执行');
}

let acceptanceResults={};
function runAcceptanceCheck(id){
 let res;
 switch(id){
  case 'V32-01':res={ok:workItems.every(w=>!w.workflowSnapshot.teamId&&!w.teamSnapshot.workflowId),detail:'工作流 / 团队快照无互绑字段'};break;
  case 'V32-02':res={ok:typeof createWorkItem==='function'&&typeof wizardWorkflow==='function',detail:'向导支持“保存到库 / 仅用于本次需求”'};break;
  case 'V32-03':res={ok:teams.every(t=>!t.workflowId),detail:'团队定义不含 Workflow ID'};break;
  case 'V32-04':res={ok:workflows.every(w=>!w.teamId&&!w.employeeId),detail:'工作流定义不含 Team / Employee ID'};break;
  case 'V32-05':res={ok:eligibleMembers(teams[0],'pm').length>0,detail:'按 Role ID 从团队筛选候选成员'};break;
  case 'V32-06':res={ok:typeof preflightWizard==='function',detail:'角色缺失时预检不通过并阻止创建'};break;
  case 'V32-07':res={ok:parallelPairs(workflows[0].nodes).length>0,detail:'检测到并行分支；占用时提供排队 / 改派'};break;
  case 'V32-08':res=lastCreatedRunId?{ok:runs.find(r=>r.id===lastCreatedRunId).tasks.every(t=>!t.assignment||!t.employeeSessionId||t.state!=='created'),detail:'新建 Run 仅含 Task DAG'}:{ok:false,detail:'请先在向导中创建一个需求'};break;
  case 'V32-09':res={ok:runs.some(r=>r.tasks.some(t=>t.state==='ready')),detail:'存在 Ready 节点可进入分配面板'};break;
  case 'V32-10':res={ok:runs.some(r=>r.tasks.some(t=>t.assignment?.state==='prepared')),detail:'Prepared 分配存在且未创建会话'};break;
  case 'V32-11':res={ok:runs.some(r=>r.tasks.some(t=>t.attempts.length>0)),detail:'启动后生成 Attempt 与会话引用'};break;
  case 'V32-12':res={ok:employees.every(e=>!e.cliId),detail:'员工档案不含 CLI 绑定'};break;
  case 'V32-13':res={ok:typeof confirmResume==='function'&&typeof failResume==='function',detail:'策略 A 失败保持中断，不静默降级'};break;
  case 'V32-14':res={ok:runs.some(r=>r.tasks.some(t=>t.attempts.some(a=>a.resumeFrom))),detail:'跨 CLI 恢复生成新 Attempt 并关联来源'};break;
  case 'V32-15':res={ok:workflows.every(w=>w.versions.length>0),detail:'工作流保存产生新版本，旧快照不受影响'};break;
  case 'V32-16':res={ok:runs.some(r=>r.tasks.some(t=>t.type==='human'&&!t.cliId&&!t.employeeId)),detail:'人工节点无 CLI / Session'};break;
  case 'V32-17':res={ok:auditEvents.some(a=>a.type==='交付验收'),detail:'交付验收已写入审计事件'};break;
  default:res={ok:false,detail:'未知用例'};
 }
 acceptanceResults[id]=res;render();toast(id+' 自检'+(res.ok?'通过':'未通过')+'：'+res.detail);
}

 <div class="grid two">
 <div class="card pad"><h3 class="title">Agent CLI 扫描</h3><div class="field"><label>启动扫描策略</label><select id="setScanPolicy" onchange="saveSettings()"><option ${appSettings.scanPolicy.startsWith('每次启动')?'selected':''}>每次启动快速扫描 + 手动完整扫描</option><option ${appSettings.scanPolicy==='仅手动扫描'?'selected':''}>仅手动扫描</option></select></div><div class="field"><label>扫描范围</label><textarea id="setScanScope" onchange="saveSettings()">${esc(appSettings.scanScope)}</textarea></div><div class="row">${btn('立即扫描','scanCli()','primary')}${btn('保存策略','saveSettings()','sm soft')}</div><div class="tiny muted" style="margin-top:8px">策略保存在原型内存中，刷新页面恢复演示默认值。</div></div>
 <div class="card pad"><h3 class="title">调度与会话策略</h3><div class="kv"><span>执行方案</span><b>一个 Work Item + 一个 Workflow 快照 + 一个 Team 快照</b></div><div class="kv"><span>节点执行人</span><b>从本次团队合格成员中映射；人工节点不映射</b></div><div class="kv"><span>CLI 选择</span><b>节点 Ready 后的 Task Assignment 级别</b></div><div class="kv"><span>会话创建</span><b>节点启动时按需创建 / 唤醒</b></div><div class="kv"><span>并发策略</span><b>同一员工默认串行，不允许同一会话并发写入</b></div><div class="kv"><span>跨 CLI 恢复</span><b>新 Host Session Binding + 新 Attempt，沿用 Employee Session</b></div></div>
 </div>
 <div class="card pad" style="margin-top:14px"><h3 class="title">状态机口径（原型演示）</h3>
 <div class="item"><b>Work Item</b><div class="flowline">${['draft','configured','ready_to_run','running','waiting_human','ready_for_acceptance','accepted','delivered'].map(s=>`<span class="step">${s} · ${STATE[s]}</span>`).join('→')}<span class="step">cancelled</span></div></div>
 <div class="item"><b>Node Task</b><div class="flowline">${['waiting_dependency','ready','assignment_prepared','preflight','creating_session','waiting_queue','running','succeeded'].map(s=>`<span class="step">${s}</span>`).join('→')}<span class="step">interrupted / failed / skipped</span></div></div>
 <div class="item"><b>Assignment</b><div class="flowline">${['draft','prepared','preflight','locked','released'].map(s=>`<span class="step">${s}</span>`).join('→')}<span class="step">failed</span></div></div>
 <div class="item"><b>Team / Workflow Definition</b><div class="flowline"><span class="step">draft</span>→<span class="step">published</span>→<span class="step">deprecated</span><span class="step">修改产生新版本；Work Item 使用快照</span></div></div>
 </div>
 <div class="card pad" style="margin-top:14px"><h3 class="title">对象隔离红线</h3><div class="grid three">
 <div class="kv"><span>Employee Profile</span><b>不含 CLI / Team ID / Session ID</b></div><div class="kv"><span>Role Definition</span><b>不含员工 / 团队 / CLI</b></div><div class="kv"><span>Team Definition</span><b>不含 Workflow ID / CLI / Session</b></div>
 <div class="kv"><span>Workflow Definition</span><b>不含 Employee / Team / CLI</b></div><div class="kv"><span>Work Item</span><b>含快照与映射，不含宿主会话细节</b></div><div class="kv"><span>Task Assignment</span><b>含本次 Employee + CLI + 权限快照</b></div>
 <div class="kv"><span>Employee Session</span><b>逻辑身份，按员工维护</b></div><div class="kv"><span>Host Session Binding</span><b>按 CLI / Adapter 维护，不跨 CLI 复用</b></div> <div class="kv"><span>原型边界</span><b>本地模拟数据，不连接 Daemon / ACP</b></div>
 </div></div>
 <div class="card pad" style="margin-top:14px"><h3 class="title">验收用例对照（V32-01 ~ V32-17）</h3><table class="table"><thead><tr><th>ID</th><th>场景</th><th>原型中的落点</th><th>自检</th></tr></thead><tbody>${[
 ['V32-01','已有工作流 + 已有团队','向导第 2/3 步选已有资产；需求详情显示两份版本快照，二者无关联字段'],
 ['V32-02','新建工作流 + 新建团队','向导第 2/3 步选“新建”，勾选“保存到库”或“仅用于本次需求”'],
 ['V32-03','团队被多个工作流复用','团队库只维护成员 / 角色 / 主备 / 版本，不显示 Workflow ID'],
 ['V32-04','工作流被多个团队复用','工作流库流程图模式展示分层 DAG、并行 / 汇合与人工门禁；只定义节点 / Role / 依赖 / 契约，不显示 Team ID 或 Employee ID'],
 ['V32-05','节点匹配团队成员','向导第 4 步按 Role ID 从本次团队筛选候选并预选'],
 ['V32-06','团队缺少角色覆盖','第 4 步红色提示 + 第 5 步预检失败，阻止创建'],
 ['V32-07','同一员工分配并行节点','第 4 步检测无先后约束的节点复用同一员工；任务分配占用时可选「改派」或「保留并排队」；流程图模式标注并行分支 ×N'],
 ['V32-08','创建 Work Item','创建后 code=configured；只有快照 / 映射 / Run / Task DAG，无 CLI 与 Session；可点“启动执行方案”进入 ready_to_run'],
 ['V32-09','节点 Ready','任务表格中 Ready 节点点“分配执行”，先选员工再选 CLI'],
 ['V32-10','保存 Prepared','保存后 Assignment=prepared，Session 未创建，可再次修改'],
 ['V32-11','启动节点','Task 记录 preflight / creating_session，Assignment 经 preflight 到 locked；能力预检失败进入 failed；按需创建 / 唤醒 Employee 与 Host Session'],
 ['V32-12','员工更换 CLI','分配面板更换 CLI；员工档案与团队定义均不修改'],
 ['V32-13','恢复原宿主','策略 A 严格恢复原宿主并回写 Binding 状态；不可恢复时保持 interrupted，不静默降级为策略 B'],
 ['V32-14','跨 CLI 检查点恢复','选策略 B：新 Host Session Binding + 新 Attempt，沿用 Employee Session ID'],
 ['V32-15','修改团队 / 工作流资产','流程图编辑可在画布增删 Agent / 人工节点与依赖；保存产生新版本，既有 Work Item 继续使用创建时快照'],
 ['V32-16','人工节点','映射与分配均跳过人工节点；批准时不产生 CLI / Session'],
 ['V32-17','交付验收','需求详情「交付验收」：accepted → delivered；deliveryRecord 保存测试 / 风险 / 验收人，审计事件可追溯']
 ].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${btn('自检',`runAcceptanceCheck('${x[0]}')`,'sm')}${acceptanceResults[x[0]]?badge(acceptanceResults[x[0]].ok?'succeeded':'failed',{succeeded:'通过',failed:'未通过'}):''}${acceptanceResults[x[0]]?'<div class="tiny muted">'+esc(acceptanceResults[x[0]].detail)+'</div>':''}</td></tr>`).join('')}</tbody></table>
 <div class="notice" style="margin-top:12px">本原型为本地模拟数据：不真实扫描 CLI、不连接 Daemon、不启动 Agent、不调用 ACP；“模拟完成 / 模拟中断 / 模拟恢复失败”只用于演示状态变化。</div></div>`
}

/* ==================== 启动 ==================== */
function init(){render();setTimeout(()=>toast('启动扫描完成：本机 Agent CLI 资源池已刷新（演示数据）'),320)}
init();
</script>
</body>
</html>
