<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maestro · 交互原型 v2（阶段一完整）</title>
<style>
:root{
  --primary:#5B5BD6;--primary-2:#8284F0;--primary-bg:#EEF0FF;
  --cyan:#06B6D4;--cyan-bg:#E2F8FC;--coral:#FF6B5A;--coral-bg:#FFF0EE;
  --green:#10B981;--green-bg:#E6F9F1;--amber:#F59E0B;--amber-bg:#FFF5E3;
  --red:#EF4444;--red-bg:#FEECEC;--ink:#1E293B;--muted:#64748B;--faint:#94A3B8;
  --line:#E9ECF5;--bg:#F6F7FC;--card:#fff;--r:14px;--r2:10px;
  --shadow:0 6px 22px rgba(91,91,214,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.app{display:flex;height:100vh;overflow:hidden}
/* sidebar */
.sidebar{width:232px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
.nav-label{font-size:11px;color:#9AA3B5;padding:14px 10px 6px;font-weight:600;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r2);color:var(--muted);font-size:13px;font-weight:500;transition:.15s;width:100%;text-align:left}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.on{background:var(--primary-bg);color:var(--primary);font-weight:600}
.nav-item .badge-n{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600}
.nav-item .ico{width:16px;text-align:center;opacity:.85}
.sidebar-foot{margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg)}
.sidebar-foot .t{font-size:11px;color:var(--muted)}
.sidebar-foot .p{font-size:12px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-foot .c{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green);margin-top:6px}
.sidebar-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.crumb b{color:var(--ink);font-weight:600}
.topbar .spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:#98A2B3;font-size:12px;min-width:180px}
.searchbox:hover{border-color:var(--primary-2)}
.iconbtn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
.iconbtn .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--coral);border-radius:50%;border:2px solid #fff}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--amber));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.content{flex:1;overflow:auto;padding:24px 28px 44px}
/* primitives */
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px}
.page-head h1{font-size:21px;font-weight:700;letter-spacing:-.4px}
.page-head p{color:var(--muted);font-size:13px;margin-top:2px}
.page-head .spacer{flex:1}
.btn{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(91,91,214,.22)}
.btn.primary:hover{background:var(--primary-2)}
.btn.ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.18s}
.card.hover:hover{border-color:var(--primary-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card.flat{padding:0;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.run{background:var(--primary-bg);color:var(--primary)}
.badge.wait{background:var(--amber-bg);color:#B45309}
.badge.done{background:var(--green-bg);color:#047857}
.badge.fail{background:var(--red-bg);color:#B91C1C}
.badge.cyan{background:var(--cyan-bg);color:#0369A1}
.badge.gray{background:#EEF1F6;color:var(--muted)}
.pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:ui-monospace,Consolas,monospace}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt20{margin-top:20px}
.divider{height:1px;background:var(--line);margin:14px 0}
.chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:500}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tab{padding:9px 15px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--primary);border-color:var(--primary);font-weight:600}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.metric .l{font-size:12px;color:var(--muted)}
.metric .v{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.metric .s{font-size:11px;color:var(--faint);margin-top:2px}
.progress{height:6px;background:#EEF1F8;border-radius:10px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),var(--cyan))}
.progress.sm{height:4px;margin-top:5px}
.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl-item.done:before{background:var(--green);border-color:var(--green)}
.tl-item.wait:before{background:var(--amber);border-color:var(--amber)}
.tl-item.fail:before{background:var(--red);border-color:var(--red)}
.tl-item:last-child{padding-bottom:0}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg);letter-spacing:.3px}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFE}
/* board */
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1120px}
.board-col{background:#EEF1F8;border-radius:12px;padding:10px;min-height:220px}
.board-col h4{font-size:12px;font-weight:600;margin-bottom:9px;color:var(--muted);display:flex;justify-content:space-between}
.mini-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px;margin-bottom:7px;cursor:pointer;box-shadow:0 1px 3px rgba(30,41,59,.04)}
.mini-card:hover{border-color:var(--primary)}
.mini-card .id{font-size:10px;color:var(--muted)}
/* log */
.log{background:#1E293B;color:#E2E8F0;border-radius:var(--r2);padding:14px;font:12px/1.85 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:440px;overflow:auto}
.log .g{color:#6EE7B7}.log .y{color:#FCD34D}.log .b{color:#93C5FD}.log .r{color:#FCA5A5}.log .m{color:#94A3B8}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:420px;max-width:96vw;height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(30,41,59,.08);z-index:40;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-body{padding:18px 20px;overflow:auto;flex:1}
.drawer-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;background:#FCFDFF}
.mask{position:fixed;inset:0;background:rgba(30,41,59,.22);z-index:30;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
/* toast + palette */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.palette{position:fixed;inset:0;background:rgba(30,41,59,.28);z-index:70;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette.on{display:flex}
.palette-box{width:560px;max-width:92vw;background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(15,23,42,.3);overflow:hidden}
.palette-input{width:100%;padding:16px 18px;border:none;outline:none;font-size:15px;border-bottom:1px solid var(--line)}
.palette-list{padding:8px;max-height:46vh;overflow:auto}
.palette-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13px;width:100%;text-align:left}
.palette-item:hover,.palette-item.sel{background:var(--primary-bg);color:var(--primary)}
.palette-sec{font-size:11px;color:var(--faint);padding:8px 12px 4px;font-weight:600}
.kbd{font:11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ico{width:52px;height:52px;border-radius:16px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px}
.notice{display:flex;align-items:center;gap:10px;background:var(--amber-bg);border:1px solid #FDE7BC;color:#92400E;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}
/* svg graph */
.graphwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px;overflow:auto;position:relative}
.graphwrap svg{display:block;min-width:900px;width:100%;height:auto}
.gnode{cursor:pointer}
.gnode:hover rect{stroke-width:2.5}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.split3{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}
.card-row{padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:9px;cursor:pointer;transition:.15s}
.card-row:hover{border-color:var(--primary-2);box-shadow:var(--shadow)}
.card-row.hl{border-color:var(--primary);background:var(--primary-bg)}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:9px;cursor:pointer;transition:.15s}
.listrow:hover{border-color:var(--primary-2);box-shadow:var(--shadow)}
.listrow .id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.mini{font-size:11px;color:var(--faint)}
.sb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div>Maestro</div>

</div>

<script>
/* ---------------- fixture data ---------------- */
const INST = {

  queue:'工作空间 / <b>审批队列</b>', notifications:'工作空间 / <b>通知</b>', assets:'资产 / <b>资产库</b>',

   <div class="card" style="background:var(--amber-bg);border-color:#FDE7BC;padding:12px">
    <b class="small">原因：轮次超限</b><div class="tiny" style="color:#92400E;margin-top:4px">reviewer 连续 2 轮判定边界条件未覆盖；核心已停止回流并挂起实例。</div></div>
   <div class="divider"></div><b class="small">涉及节点</b>
   <div class="tiny muted mt6">T-03 边界条件审核 · reviewer · 第 2 轮 · 已挂起 1m 12s</div>
   <div class="divider"></div><b class="small">可选动作</b>
   <div class="tiny muted mt6">继续升级：接受当前产出，进入人工终审</div>
   <div class="tiny muted mt6">重派：清空本轮会话，重新投递交接包</div>
   <div class="tiny muted mt6">终止：实例不再继续，证据与日志保留</div>
  </div>
  <div class="drawer-foot"><button class="btn primary" style="flex:1" data-decision="${id}|继续升级">继续升级</button><button class="btn ghost" data-decision="${id}|重派">重派</button><button class="btn ghost" data-decision="${id}|终止">终止</button></div>`);
}
/* ---------------- render ---------------- */
function render(){
  document.getElementById('crumb').innerHTML = CRUMBS[S.page] || (`实例 / ${S.instance} / <b>${(TABS.find(t=>t[0]===S.tab)||[,'概览'])[1]}</b>`);
  document.querySelectorAll('.nav-item').forEach(n=>{
    const on = n.dataset.go===S.page || (S.page==='drill'&&n.dataset.go==='instances') || (S.page==='new'&&n.dataset.go==='instances');
    n.classList.toggle('on',!!on);
  });
  const map = {projects:pgProjects,instances:pgInstances,new:pgNew,overview:pgOverview,flow:pgFlow,board:pgBoard,drill:pgDrill,
    queue:pgQueue,evidence:pgEvidence,assets:pgAssets,occupancy:pgOccupancy,canvas:pgCanvas,governance:pgGovernance,
    notifications:pgNotifications,settings:pgSettings};
  const c = document.getElementById('content');
  const fn = map[S.page];
  c.innerHTML = fn ? fn() : pgOverview();
  c.scrollTop = 0;
}
const GLOBAL_PAGES = ['projects','instances','new','queue','notifications','assets','occupancy','canvas','governance','settings'];
function go(p,o={}){
  if(S.page!==p) S.back.push({page:S.page,tab:S.tab,instance:S.instance,inst:S.inst});
  Object.assign(S,{inst:!GLOBAL_PAGES.includes(p)},o,{page:p});
  if(['overview','flow','board','queue','evidence'].includes(p)) S.tab = p;
  render();
}
function back(){const b=S.back.pop(); if(b){Object.assign(S,b);} else {S.page='instances';S.inst=false;} render();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
/* ---------------- palette ---------------- */
const PAL = [
  ['页面','实例列表','instances'],['页面','审批队列','queue'],['页面','资产库','assets'],['页面','角色占用','occupancy'],
  ['页面','工作流画布','canvas'],['页面','审计与治理','governance'],['页面','通知','notifications'],['页面','设置','settings'],
  ['实例','INST-084 用户注册重构','INST-084'],['实例','INST-083 支付回调幂等','INST-083'],['实例','INST-082 导出接口文档','INST-082'],
  ['实例','INST-081 登录态竞态修复','INST-081'],['动作','新建实例','new']
];
function palette(open){
  const p = document.getElementById('palette');
  p.classList.toggle('on',open!==false ? !p.classList.contains('on') : false);
  if(p.classList.contains('on')){document.getElementById('pinput').value='';drawPalette('');setTimeout(()=>document.getElementById('pinput').focus(),30)}
}
function drawPalette(q){
  const hits = PAL.filter(x=>!q||x[1].toLowerCase().includes(q.toLowerCase()));
  document.getElementById('plist').innerHTML = hits.map((x,i)=>`<button class="palette-item ${i===0?'sel':''}" data-pal="${x[2]}" data-palkind="${x[0]}"><span class="tag">${x[0]}</span>${x[1]}</button>`).join('')||'<div class="tiny muted" style="padding:14px">无匹配结果</div>';
}
/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  if(e.target.id==='palette'){palette(false);return}
  const pal=e.target.closest('[data-pal]'); if(pal){palette(false);const v=pal.dataset.pal;
    if(pal.dataset.palkind==='实例'){S.instance=v;go('overview')}else{go(v)} return}
  const nav=e.target.closest('[data-go]'); if(nav){go(nav.dataset.go);return}
  const backBtn=e.target.closest('[data-back]'); if(backBtn){back();return}
  const ins=e.target.closest('[data-instance]'); if(ins){S.instance=ins.dataset.instance;go('overview');return}
  const tab=e.target.closest('[data-tab]'); if(tab){S.tab=tab.dataset.tab;S.page=tab.dataset.tab;S.inst=true;render();return}
  const f=e.target.closest('[data-filter]'); if(f){S.filter=f.dataset.filter;render();return}
  const a=e.target.closest('[data-asset]'); if(a){S.asset=a.dataset.asset;render();return}
  const ev=e.target.closest('[data-evid]'); if(ev){S.selNode=ev.dataset.evid;render();return}
  const drill=e.target.closest('[data-drill]'); if(drill){S.drillRole=drill.dataset.drill;go('drill');return}
  const dag=e.target.closest('[data-dag]'); if(dag){S.hlCard=NODES.find(n=>n.role===dag.dataset.dag)?.id||null;render();
    toast('已定位到 '+dag.dataset.dag+' 的卡片');return}
  const conn=e.target.closest('[data-conn]'); if(conn){drawConnection(conn.dataset.conn);return}
  const sub=e.target.closest('[data-subflow]'); if(sub){toast('下钻子工作流（原型）：复用同一布局算法');return}
  const card=e.target.closest('[data-card]'); if(card){drawNode(card.dataset.card);return}
  const esc=e.target.closest('[data-esc]'); if(esc){drawEscalation(esc.dataset.esc);return}
  const dec=e.target.closest('[data-decision]'); if(dec){
    const [id,act]=dec.dataset.decision.split('|');
    if(act==='终止' && !confirm('终止实例 '+id+'？终止后不再继续')){return}
    S.queueDone.push(id);closeDrawer();render();toast(id+' 已处理 · '+act+' · 流程已更新');return}
  const act=e.target.closest('[data-act]'); if(act){
    const a=act.dataset.act;
    if(a==='close'){closeDrawer();return}
    if(a==='palette'){palette(true);return}
    if(a==='newproj'){toast('新建项目（原型）：调起原生目录选择');return}
    if(a==='submit'){toast('实例已启动 · 正在编排角色');go('instances');return}
    if(a==='pick'){toast('已选择模板');return}
    if(a==='jump'){toast('已在宿主中定位到对应会话');return}
    if(a==='locate'){closeDrawer();go('flow');toast('已在流程图中定位节点');return}
    if(a==='copy'){toast('摘要已复制到剪贴板');return}
    if(a==='export'||a==='exportasset'){toast('导出已开始（原型）');return}
    if(a==='readall'){S.readAll=true;render();toast('通知已全部标为已读');return}
    if(a==='reset'){closeDrawer();toast('已重投交接包 H-116');return}
    if(a==='pause'){toast('实例已暂停 · 检查点已保存');return}
    if(a==='abort'){if(confirm('终止实例 INST-084？'))toast('实例已终止 · 证据保留');return}
    if(a==='zoomout'||a==='zoomin'||a==='focus'||a==='collapse'){toast('视图操作（原型）：'+a);return}
    if(a==='validate'){toast('校验完成：5 通过 · 1 不通过');return}
    if(a==='diff'){toast('与内置版本对比（原型）');return}
    if(a==='otel'){toast('追踪已导出为 OpenTelemetry');return}
    if(a==='dryrun'){toast('试运行校验通过 · 未启动会话');return}
    if(a==='importpkg'||a==='migrate'||a==='recent'){toast('原型动作：'+a);return}
  }
  if(e.target.id==='mask')closeDrawer();
});
document.addEventListener('input',e=>{if(e.target.id==='pinput')drawPalette(e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('palette').classList.contains('on'))palette(false);else closeDrawer()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette(true)}
});
render();
</script>
</body>
</html>
